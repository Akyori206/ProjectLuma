function parseCSV(text){
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===','){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);f='';if(row.some(x=>x!==''))rows.push(row);row=[]}
    else f+=c}
  row.push(f);if(row.some(x=>x!==''))rows.push(row);return rows;
}
function normDate(s){s=String(s||'').trim();let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);if(m){const y=m[3].length===2?'20'+m[3]:m[3];return y+'-'+pad(+m[1])+'-'+pad(+m[2])}return''}
function importCSV(text){
  const rows=parseCSV(text);if(rows.length<2){toast('That file has no trade rows.');return}
  const hd=rows[0].map(x=>x.trim().toLowerCase()),ix=(...n)=>hd.findIndex(h=>n.includes(h));
  const iD=ix('date'),iT=ix('time'),iS=ix('symbol','ticker','instrument'),iDir=ix('direction','side'),iR=ix('risk','risk amount'),iP=ix('pnl','p&l','profit','net p&l'),iSu=ix('setup','strategy'),iDe=ix('details','notes','note');
  if(iD<0){toast('The CSV needs a date column.');return}
  const jid=activeJournal().id;let n=0;
  for(const r of rows.slice(1)){
    const date=normDate(r[iD]);if(!date)continue;
    const pnlRaw=iP>=0?String(r[iP]).replace(/[$,\s]/g,''):'',pnl=parseFloat(pnlRaw),side=iDir>=0?String(r[iDir]).toLowerCase():'';
    S.trades.push(blankTrade({journalId:jid,date,time:iT>=0&&/^\d{1,2}:\d{2}/.test(r[iT])?pad(parseInt(r[iT]))+':'+r[iT].split(':')[1].slice(0,2):'09:30',symbol:iS>=0?String(r[iS]).toUpperCase():S.settings.symbol,direction:/short|sell/.test(side)?'short':'long',risk:iR>=0?Math.abs(parseFloat(String(r[iR]).replace(/[$,\s]/g,''))||0):0,pnl:isFinite(pnl)?pnl:0,open:!isFinite(pnl),setup:iSu>=0?r[iSu]:'',details:iDe>=0?r[iDe]:''}));
    n++;
  }
  persist();render();toast(n?`Imported ${n} trade${n>1?'s':''} into ${activeJournal().name}.`:'No valid rows found.');
}
async function saveFile(name,data){
  if(window.claude&&window.claude.use){
    try{const dl=await window.claude.use('downloads');if(dl){await dl.save({filename:name,data});toast('Saved '+name);return}}
    catch(e){if(e&&e.code==='declined')return}
  }
  try{
    const type=name.endsWith('.json')?'application/json':name.endsWith('.csv')?'text/csv':'text/html';
    const u=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');
    a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500);toast('Saved '+name);
  }catch(e){toast('The file could not be saved.')}
}
function exportCSV(){
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const rows=[['date','time','journal','symbol','direction','setup','risk','pnl','habits','confluences','details']].concat([...S.trades].sort(cmpAsc).map(t=>[t.date,t.time,(jOf(t)||{}).name||'',t.symbol,t.direction,t.setup,t.risk,t.open?'':t.pnl,habitNames(t).join('; '),(t.confluences||[]).join('; '),t.details]));
  saveFile('projectluma-trades.csv',rows.map(r=>r.map(q).join(',')).join('\n'));
}

    return{text:'Your costliest habits right now:\n'+tab.map(h=>`- **${h.name}**: ${h.n} flag${h.n>1?'s':''}, ${money(h.cost)}`).join('\n')+(tab[0].cost<0?`\n\nStart with “${tab[0].name}”. Before each entry, ask yourself whether you are about to do it.`:''),chips:['Best time of day for me','Which confluences work best?']};
  }
  if(/confluence/.test(t)){
    const cr=confRows(cl).filter(r=>r.n>=2);
    if(!cr.length)return{text:'Not enough confluence data yet. Add confluences to your entries and I can tell you which ones pay.',chips:[]};
    const w=cr[cr.length-1];
    return{text:`Best confluence: ${fm(cr[0])}.\n${cr.length>1?`Weakest: ${fm(w)}.`:''}`,chips:['What should I work on?']};
  }
  if(/setup|strategy/.test(t)){
    const rs=groupRows(cl,x=>x.setup||'No setup set').sort((a,b)=>b.pnl-a.pnl);
    return{text:`Best setup: ${fm(rs[0])}.${rs.length>1?`\nWeakest: ${fm(rs[rs.length-1])}.`:''}`,chips:['Which confluences work best?']};
  }
  if(/time of day|best time|worst time|hour|morning|afternoon|session|window|when do i/.test(t)){
    const rs=groupRows(cl,x=>bucketOf(x.time)).sort((a,b)=>b.pnl-a.pnl);
    return{text:`Your best window is ${fm(rs[0])}.${rs.length>1?`\nYour weakest is ${fm(rs[rs.length-1])}.`:''}`,chips:['What should I work on?']};
  }
  return{text:`Across your live journals: ${pl(st.n)}, **${money(st.total)}** total, ${pct(st.winRate)} win rate, profit factor ${fmtPF(st.pf)}, average win ${money(st.avgWin,false)} against average loss ${money(st.avgLoss,false)}.`,chips:['How am I doing this week?','What should I work on?']};
}
function chatRender(){
  const d=$('#drawer');d.classList.toggle('open',chat.open);d.setAttribute('aria-hidden',!chat.open);
  const log=$('#chatlog');
  const chips=a=>a&&a.length?`<div class="sugg" style="margin-top:8px">${a.map(s=>`<button class="chip" data-act="chat-sugg" data-q="${esc(s)}">${esc(s)}</button>`).join('')}</div>`:'';
  if(!chat.turns.length){
    log.innerHTML=`<div class="msg"><p>Hi! I'm Luma. Ask me about your results, habits, confluences or setups, or tell me what you're trying to improve. What would you like to look at?</p></div>${chips(chipsDefault())}`;
    return;
  }
  log.innerHTML=chat.turns.map((t,i)=>`<div class="msg ${t.role==='user'?'me':''}">${t.role==='user'?esc(t.label||t.content):(t.content?md(t.content):'<p>Thinking...</p>')}${t.err?'<div style="margin-top:8px"><button class="chip" data-act="chat-retry">Try again</button></div>':''}${t.role==='assistant'&&i===chat.turns.length-1?chips(t.chips):''}</div>`).join('');

async function sendChat(text,label){
  text=(text||'').trim();if(!text||chat.busy)return;
  const u={role:'user',content:text};if(label)u.label=label;
  const talk=localSmallTalk(text);
  if(talk){chat.turns.push(u,{role:'assistant',content:talk.text,chips:talk.chips});chatRender();return}
  if(!AI&&aiSource==='locked'){const ok=await unlockKey();if(ok)return sendChat(text,label)}
  if(!AI){
    const a=localAnswer(text);
    chat.turns.push(u,{role:'assistant',content:a?a.text:"I can chat and answer quick questions about your results, habits, best times, setups and confluences. For deeper, open-ended questions I need my AI brain connected. Add your Anthropic API key in Settings and I'll be fully chatty. Meanwhile, try one of these.",chips:a?a.chips:chipsDefault()});
    chatRender();return;
  }
  if(!aiBegin())return;
  chat.turns.push(u,{role:'assistant',content:''});chat.busy=true;chatRender();
  const hist=chat.turns.slice(0,-1).filter(t=>!t.err).slice(-6).map(t=>({role:t.role,content:t.content}));
  const input=[{role:'user',content:RULES+'\n\nJOURNAL DATA (may be empty)\n'+dataContext()+'\n\nThe conversation follows.'},...hist];
  const ctl=chat.ctl=new AbortController();const slot=chat.turns[chat.turns.length-1];
  try{
    const r=await AI(input,{cache:false,signal:ctl.signal,onText:({text})=>{slot.content=text;chatRender()}});
    slot.content=r.text;slot.chips=chipsDefault().slice(0,3);
  }catch(e){
    const m=aiErr(e),la=e&&e.code!=='cancelled'?localAnswer(text):null;
    slot.content=(e&&e.text)||((m?m+' ':'')+(la?"Here's a quick answer from your numbers in the meantime:\n\n"+la.text:"I'm still around for quick questions about your results, though."))||'Stopped.';
    slot.chips=la&&la.chips&&la.chips.length?la.chips:chipsDefault().slice(0,3);
    slot.err=!!m&&e.code!=='cancelled';
  }
  chat.busy=false;aiEnd();chatRender();
}

/* ----- low level ----- */
async function sb(path,o){
  o=o||{};
  const h={apikey:cloud.key,...(o.headers||{})};
  if(o.auth!==false&&cloud.session)h.Authorization='Bearer '+cloud.session.access_token;
  else if(/^eyJ/.test(cloud.key))h.Authorization='Bearer '+cloud.key;   /* legacy anon keys are JWTs; new sb_publishable_ keys go in apikey only */
  const isBlob=typeof Blob!=='undefined'&&o.body instanceof Blob;
  if(o.body!==undefined&&!isBlob&&!h['Content-Type'])h['Content-Type']='application/json';
  const r=await fetch(cloud.url+path,{method:o.method||'GET',headers:h,body:o.body===undefined?undefined:(isBlob?o.body:JSON.stringify(o.body))});
  if(!r.ok){
    let m={};try{m=await r.json()}catch(e){}
    throw{status:r.status,message:m.msg||m.error_description||m.message||m.error||('Request failed ('+r.status+')'),code:m.error_code||m.code};
  }
  if(o.blob)return r.blob();
  const t=await r.text();
  return t?JSON.parse(t):null;
}
function keyProblem(key){
  key=String(key||'').trim();
  if(/^sb_secret_/.test(key))return 'That is a secret key. Never paste it here. Use the publishable key, which starts with sb_publishable_.';
  if(/^sb_publishable_/.test(key))return key.length<30?'That key looks too short. Copy the whole publishable key.':'';
  const parts=key.split('.');
  if(parts.length===3){
    try{const r=JSON.parse(atob(parts[1].replace(/-/g,'+').replace(/_/g,'/'))).role;
      if(r==='service_role')return 'That is the service_role key. Never paste it here. Use the publishable key, or the legacy anon key.';
      if(r==='anon')return '';
    }catch(e){}
  }
  return 'That does not look like a Supabase publishable key. It starts with sb_publishable_.';
}
function friendlyAuthError(e){
  const m=String(e&&e.message||'').toLowerCase();
  if(/invalid login/.test(m))return "That email or password isn't right.";
  if(/not confirmed/.test(m))return 'Please confirm your email first. Check your inbox for the link.';
  if(/already registered|already been registered/.test(m))return 'An account with that email already exists. Try signing in.';
  if(/password/.test(m)&&/(short|least|weak|characters)/.test(m))return 'That password is too short or too weak.';
  if((e&&e.status===429)||/rate limit|too many/.test(m))return 'Too many attempts. Wait a minute and try again.';
  if(/failed to fetch|networkerror|network request/.test(m))return 'Could not reach the server. Check your connection and the project URL.';
  return e&&e.message?e.message:'Something went wrong. Try again.';
}

async function cloudPush(force){

  cloud.busy=true;setStatus('syncing');

    if(!force&&cloud.baseAt){
      const stamp=await cloudFetchStamp();
      if(stamp&&stamp!==cloud.baseAt){cloud.busy=false;setStatus('conflict');openConflict();return}
    }
    const at=await cloudUpsert();
    cloud.baseAt=at;cloud.dirty=false;saveSyncMeta();setStatus('synced');
    sb('/rest/v1/rpc/touch_profile',{method:'POST',body:{p_trades:S.trades.length,p_journals:S.journals.length}}).catch(()=>{});
    mediaSyncAll();
  }catch(e){

document.addEventListener('submit',async e=>{

    }
    if(mode==='reset'){
      const p1=v('password'),p2=v('password2');
      if(p1.length<8){setMsg('err','Use at least 8 characters.');return}
      if(p1!==p2){setMsg('err',"Those passwords don't match.");return}
      busy(true);await authChangePassword(p1);cloud.gateMsg=null;finishGate();toast('Password updated.');return;
    }

    if(!/^\S+@\S+\.\S+$/.test(em)){setMsg('err','Enter a valid email address.');return}
    if(mode==='signup'){

    }

    busy(true);setMsg('ok','Signing in...');
    await authSignIn(em,pw);cloud.pendingPw=pw;cloud.gateMsg=null;await afterAuth();
  }catch(err){

/* ---------- AI KEY: locked with the account password ---------- */
/* The key is encrypted on this device (PBKDF2 + AES-GCM) with the account password, never uploaded, and only usable after the password is entered. */
const _enc=new TextEncoder(),_dec=new TextDecoder();
const _b64=u=>btoa(String.fromCharCode(...u)),_unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function _derive(pw,salt){
  const base=await crypto.subtle.importKey('raw',_enc.encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function sealKey(plain,pw){
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),k=await _derive(pw,salt);
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,_enc.encode(plain)));
  return{v:1,salt:_b64(salt),iv:_b64(iv),ct:_b64(ct)};
}
async function openKey(box,pw){
  const k=await _derive(pw,_unb64(box.salt));
  return _dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:_unb64(box.iv)},k,_unb64(box.ct)));
}
async function authVerifyPassword(pw){
  const j=await sb('/auth/v1/token?grant_type=password',{method:'POST',auth:false,body:{email:cloud.session.user.email,password:pw}});
  saveSession(normSession(j));
}
async function unlockKey(){
  const box=S&&S.settings&&S.settings.apiKeyEnc;if(!box)return false;
  if(cloud.unlockedKey){useKeyAI();return true}
  const pw=await ask('Unlock your AI key',{password:true,placeholder:'Account password',message:'Your API key is locked with your account password. Enter it to use the AI in this session.',okLabel:'Unlock'});
  if(!pw)return false;
  try{const plain=await openKey(box,pw);cloud.unlockedKey=plain;AI=null;useKeyAI();toast('AI unlocked for this session.');return true}
  catch(e){toast("That password didn't unlock the key. If you changed or reset your password, remove the key and paste it again.");return false}
}
async function tryAutoUnlock(){
  const pw=cloud.pendingPw;cloud.pendingPw=null;

}
async function saveApiKey(v){
  v=String(v||'').trim();
  if(!/^sk-ant-/.test(v)){toast('That does not look like an Anthropic API key. Keys start with sk-ant-.');return false}
  toast('Checking the key with Anthropic...');
  const chk=await checkKeyLive(v);
  if(!chk.ok&&chk.e&&chk.e.code==='not_granted'){toast(chk.msg);return false}
  if(!chk.ok&&chk.e&&chk.e.code==='needs_workspace')toast(chk.msg);
  else if(!chk.ok&&chk.e&&chk.e.code!=='no_credit'&&chk.e.code!=='rate_limited')toast("I couldn't verify the key right now, so I'll save it anyway. Use Test key later to check it.");
  if(cloud.session){
    const pw=await ask('Confirm your password',{password:true,placeholder:'Account password',message:'Your API key will be locked with your account password, so it can only be used after you enter it.',okLabel:'Lock and save'});
    if(!pw)return false;
    try{await authVerifyPassword(pw)}catch(e){toast("That password isn't right.");return false}
    S.settings.apiKeyEnc=await sealKey(v,pw);delete S.settings.apiKey;cloud.unlockedKey=v;
    toast('API key saved and locked with your password.');
  }else{
    S.settings.apiKey=v;toast('API key saved on this device. Create an account to lock it with a password.');
  }
  persist();
  if(aiSource!=='claude'){AI=null;aiSource='';useKeyAI()}
  return true;
}
async function lockPlainKey(){
  const v=S.settings&&S.settings.apiKey;if(!v||!cloud.session)return false;
  const pw=await ask('Confirm your password',{password:true,placeholder:'Account password',message:'This locks the API key already saved on this device.',okLabel:'Lock it'});

  S.settings.apiKeyEnc=await sealKey(v,pw);delete S.settings.apiKey;cloud.unlockedKey=v;persist();toast('API key locked with your password.');return true;
}

async function checkKeyLive(v){
  const prev=aiSource;aiSource='key';
  try{await makeKeyAI(v)('Reply with the single word: ready',{modelTier:'quick'});return{ok:true}}
  catch(e){return{ok:false,e,msg:aiErr(e)}}
  finally{aiSource=prev}
}
async function testApiKey(typed){
  let plain=String(typed||'').trim();
  if(plain&&!/^sk-ant-/.test(plain)){toast('That does not look like an Anthropic API key. Keys start with sk-ant-.');return}
  if(!plain){
    plain=S.settings.apiKey||cloud.unlockedKey;
    if(!plain&&S.settings.apiKeyEnc){if(!await unlockKey())return;plain=cloud.unlockedKey}
  }
  if(!plain){toast('Paste a key first, or save one.');return}
  toast(typed?'Testing the key you pasted...':'Testing your saved key...');
  const r=await checkKeyLive(plain);
  if(r.ok)toast(typed?'That key works. Press Lock and save to keep it.':'Your saved key works. Luma can use the AI.');
  else toast(r.msg||'The test failed.');
}

    {label:'New trade',hint:'Journal',ic:'plus',run:()=>{go('journal');setTimeout(()=>{const b=$('[data-act=new-trade]');if(b)A['new-trade'](b)},260)}},
    {label:'Ask Luma',hint:'Assistant',ic:'spark',run:()=>A['chat-open']()},
    {label:'Open settings',hint:'App',ic:'gear',run:()=>A['settings-open']()},
    {label:S.ui.theme==='dark'?'Switch to light theme':'Switch to dark theme',hint:'Appearance',ic:'gear',run:()=>A['set-theme']({dataset:{t:S.ui.theme==='dark'?'light':'dark'}})}
  ];
  const q=cmdk.q.trim().toLowerCase();
  if(!q)return base;
  const out=base.filter(i=>i.label.toLowerCase().includes(q));
  if(cmdk.q.trim().length>1)out.push({label:`Search trades for "${cmdk.q.trim()}"`,hint:'Journal',ic:'search',run:()=>{S.ui.q=cmdk.q.trim();S.ui.resultFilter='all';S.ui.day='';go('journal')}});

}

document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();cmdk.open?cmdkClose():cmdkOpen();return}
  if(!cmdk.open)return;
  if(e.key==='Escape'){cmdkClose();return}
  if(e.key==='ArrowDown'){e.preventDefault();cmdk.sel=Math.min(cmdk.sel+1,cmdkItems().length-1);cmdkRender();return}
  if(e.key==='ArrowUp'){e.preventDefault();cmdk.sel=Math.max(cmdk.sel-1,0);cmdkRender();return}
  if(e.key==='Enter'){e.preventDefault();cmdkPick(cmdk.sel)}
});

/* ---------- ambient starfield canvas ---------- */
(function initStarfield(){
  const cv=document.getElementById('starfield');if(!cv||!cv.getContext)return;
  const ctx=cv.getContext('2d');let w=0,h=0,stars=[];const reduced=reducedMotion();
  function resize(){
    w=cv.width=innerWidth;h=cv.height=innerHeight;
    const n=Math.min(160,Math.floor((w*h)/9000));
    stars=Array.from({length:n},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.3+.3,s:Math.random()*.35+.06,hue:Math.random()>.72}));
  }
  function frame(){
    ctx.clearRect(0,0,w,h);
    for(const st of stars){
      ctx.beginPath();ctx.fillStyle=st.hue?'rgba(0,229,255,.75)':'rgba(220,235,255,.8)';
      ctx.arc(st.x,st.y,st.r,0,Math.PI*2);ctx.fill();
      if(!reduced){st.y+=st.s;if(st.y>h)st.y=0}
    }
    if(!reduced)requestAnimationFrame(frame);
  }
  addEventListener('resize',resize,{passive:true});
  resize();frame();
})();

function tradeField(el,type){
  const t=curTrade();if(!t)return;const f=el.dataset.tf;
  if(f==='img'){if(type==='change'&&el.files.length)addImages(Array.from(el.files));return}
  if(f==='video'){
    if(type==='change'&&el.files[0])saveVideo(t,el.files[0]);
    return;
  }
  const v=el.type==='checkbox'?el.checked:el.value;
  if(f==='pnl'){if(v===''){t.open=true;t.pnl=0}else{t.open=false;t.pnl=Number(v)||0}updateHead(t)}
  else if(f==='risk'){t.risk=Math.abs(Number(v)||0);updateHead(t)}
  else if(f==='symbol')t.symbol=String(v).toUpperCase();
  else if(f==='date'||f==='time'){if(v){t[f]=v;updateHead(t)}}
  else if(f==='near')t.near=!!v;
  else{t[f]=v;if(f==='journalId'){persist();drawPanel();return}}
  saveSoon();
}
async function saveVideo(t,file){
  if(!/^video\//.test(file.type)&&!/\.(mp4|mov|m4v|webm|mkv|avi)$/i.test(file.name)){toast('That does not look like a video file.');return}
  const st=$('#vidstat');if(st)st.textContent=`Saving ${file.name} (${fmtSize(file.size)})...`;
  const id=uid('vid'),old=t.videoId;
  const ok=await media.put(id,file);
  if(old&&unreferenced(old,t))media.del(old);
  t.videoId=id;persist();
  if(curId===t.id)drawPanel();
  if(ok)toast(`Video saved (${fmtSize(file.size)}).`);
  else toast('Browser storage could not hold this video, so it will only last until you close the page. Free up disk space, or keep the original file.');
}

  const t=curTrade();if(!t)return;const f=el.dataset.bl,i=Number(el.dataset.i);if(!t[f])return;

  if(type==='change'&&!el.value.trim()){t[f].splice(i,1);persist();drawPanel()}
}

  const t=curTrade();if(!t)return;const i=Number(el.dataset.conf);
  t.confluences[i]=el.value;saveSoon();

}
function processIcon(file){
  return new Promise((res,rej)=>{
    const img=new Image(),u=URL.createObjectURL(file);
    img.onload=()=>{
      const k=Math.min(1,256/Math.max(img.width,img.height)),w=Math.max(1,Math.round(img.width*k)),h=Math.max(1,Math.round(img.height*k)),c=document.createElement('canvas');
      c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(img,0,0,w,h);
      let transparent=false;try{const d=x.getImageData(0,0,w,h).data;for(let i=3;i<d.length;i+=4){if(d[i]<245){transparent=true;break}}}catch(e){}
      URL.revokeObjectURL(u);
      c.toBlob(b=>{if(!b)return rej(new Error('encode'));const r=new FileReader();r.onload=()=>res({url:r.result,transparent});r.readAsDataURL(b)},'image/png');
    };
    img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('decode'))};img.src=u;
  });
}
async function importJsonBackup(file){
  let data;try{data=JSON.parse(await file.text())}catch(e){toast('That file is not a valid backup.');return}
  if(!data||!Array.isArray(data.journals)||!Array.isArray(data.trades)){toast('That file is not a ProjectLuma backup.');return}
  if(!await ask('Replace everything with this backup?',{confirmOnly:true,message:`It contains ${data.journals.length} journals and ${data.trades.length} trades. Your current data will be replaced. Screenshots and videos are not part of a backup.`,okLabel:'Replace',danger:true}))return;
  const k=S.settings?{apiKey:S.settings.apiKey,apiKeyEnc:S.settings.apiKeyEnc}:{};S=data;S.settings=S.settings||{};delete S.settings.apiKey;delete S.settings.apiKeyEnc;if(k.apiKey)S.settings.apiKey=k.apiKey;if(k.apiKeyEnc)S.settings.apiKeyEnc=k.apiKeyEnc;normalize();persist();closeDlg(true);render();toast('Backup restored.');
}
function custField(el,type){
  const f=el.dataset.cf;
  if(f==='importjson'){if(type==='change'&&el.files[0])importJsonBackup(el.files[0]);return}
  if(f==='iconimg'){
    if(type==='change'&&el.files[0]){const j=jFrom(el);processIcon(el.files[0]).then(r=>{j.iconImg=r.url;j.iconOpaque=!r.transparent;persist();drawCust()}).catch(()=>toast('That image could not be read.'))}
    return;
  }
  if(f==='import'){
    if(type==='change'&&el.files[0]){const r=new FileReader();r.onload=()=>importCSV(String(r.result));r.readAsText(el.files[0])}
    return;
  }
  const j=jFrom(el);
  if(f==='banner'){
    if(type==='change'&&el.files[0])toJpeg(el.files[0],1600,.8).then(blobToDataUrl).then(u=>{j.banner={type:'image',value:u};persist();drawCust()}).catch(()=>toast('That image could not be read.'));
    return;
  }
  if(f==='name'){j.name=el.value||'Untitled';saveSoon();if(type==='change')drawCust()}
  else if(f==='icon'){j.icon=el.value||'📈';j.iconImg='';saveSoon();if(type==='change')drawCust()}
  else if(f==='accent'){j.accent=el.value;applyTheme();saveSoon();if(type==='change')drawCust()}
  else if(f==='desc'){j.desc=el.value;saveSoon();if(type==='change'){persist();drawCust()}}
}
function pageIn(el,type){
  const k=el.dataset.in;
  if(k==='q'){fs(jFrom(el)).q=el.value;renderJBody();return}
  if(type!=='change')return;
  const v=el.value;
  if(k==='voice-name'){S.settings.voiceName=v;persist();return}
  if(k==='dash-j')S.ui.dash.j=v;else if(k==='dash-cmp')S.ui.dash.cmp=v;else if(k==='dash-a')S.ui.dash.a=v;else if(k==='dash-b')S.ui.dash.b=v;
  else if(k==='hab-scope')S.ui.habScope=v;
  else if(k==='dcal-month'){if(/^\d{4}-\d{2}$/.test(v)){S.ui.dashCal=v+'-01';S.ui.dashDay=''}}
  else if(k==='rev-week')S.ui.reviewWeek=v;else if(k==='rev-j')S.ui.reviewJ=v;
  else if(k==='news-min')S.settings.minBefore=Number(v);
  persist();render();
}
function btField(el,type){

const onField=e=>{

function normalize(){
  const b=blankState(),cur=S.settings||{};
  S.settings={...defaultSettings(),...cur};
  const map={US:'USD',EU:'EUR',UK:'GBP',JP:'JPY',CA:'CAD',AU:'AUD'};
  S.settings.newsCountries=(S.settings.newsCountries||[]).map(c=>map[c]||c);
  if(!S.settings.newsCountries.length)S.settings.newsCountries=['USD'];
  delete S.settings.wake;
  S.settings.newsImpact=(S.settings.newsImpact||[]).filter(x=>['high','medium','low','holiday'].includes(x));
  if(!S.settings.newsImpact.length)S.settings.newsImpact=['high','medium'];
  S.ui={...b.ui,...(S.ui||{})};
  S.ui.dash={...b.ui.dash,...(S.ui.dash||{})};
  S.ui.bt={...b.ui.bt,...(S.ui.bt||{})};
  S.reviews=S.reviews||[];S.remind=S.remind||{};S.habits=S.habits&&S.habits.length?S.habits:baseHabits();
  S.journals.forEach(j=>{if(!j.kind)j.kind='live';if(!j.density)j.density='comfortable';if(S.demo&&j.id==='j2'&&j.accent==='#f0b04a')j.accent='#c6f432';if(S.demo&&j.kind==='backtest'&&j.accent==='#7aa7ff')j.accent='#f5b731'});
  S.trades.forEach(t=>{t.habits=t.habits||[];t.imageIds=t.imageIds||[];t.annotations=t.annotations||[];t.confluences=t.confluences||[];t.good=t.good||[];t.bad=t.bad||[]});
  S.trades.forEach(t=>{
    if(isBt(jOf(t))&&!t.merged){
      const parts=[];if(t.ai&&t.ai.summary)parts.push(t.ai.summary);if(t.details)parts.push(t.details);if(t.outliers)parts.push('Outliers: '+t.outliers);
      if((t.ai&&t.ai.summary)||t.outliers)t.details=withConfLine(parts.join('\n\n'),t.confluences||[]);
      t.merged=true;
    }
  });
  const bj=btJournal();
  if(!bj.feedDone){if(bj.layout==='gallery')bj.layout='feed';bj.feedDone=true}
  if(S.demo&&!tradesOf(bj.id).length)genTrades(S,bj.id,13,1,.5,.35,53,true);
  S.ui.view='dashboard';S.ui.newsRange=defaultNewsRange();S.ui.newsOff=0;S.ui.dashCal=monthStart(new Date());S.ui.dashDay='';
  ensureRefs();
}
/* Keep browsers and password managers from filling saved passwords into ordinary fields. Real sign-in and password fields keep their proper autocomplete. */
function hardenInputs(root){
  try{
    const list=[];if(root&&root.matches&&root.matches('input,textarea'))list.push(root);
    if(root&&root.querySelectorAll)root.querySelectorAll('input,textarea').forEach(e=>list.push(e));
    list.forEach(el=>{
      if(el.closest&&el.closest('#authform'))return;
      const t=(el.getAttribute('type')||'text').toLowerCase();
      if(['password','checkbox','radio','file','color','date','time','month','range'].includes(t))return;
      if(el.getAttribute('data-ah'))return;
      el.setAttribute('autocomplete','off');el.setAttribute('data-lpignore','true');el.setAttribute('data-1p-ignore','true');el.setAttribute('data-bwignore','true');el.setAttribute('data-form-type','other');el.setAttribute('data-ah','1');
    });
  }catch(e){}
}

  hardenInputs(document);
  try{if(typeof MutationObserver!=='undefined')new MutationObserver(ms=>{ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType===1)hardenInputs(n)}))}).observe(document.body,{childList:true,subtree:true})}catch(e){}
  await cloudBoot();

  setInterval(checkReminders,30000);
})();
