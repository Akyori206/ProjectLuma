<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ProjectLuma // Command Deck</title>
<meta name="description" content="ProjectLuma Command Deck: a holographic trading cockpit — live journal, AI backtest replay, voice-driven review and market signals in one HUD.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2300e5ff'/%3E%3Cstop offset='1' stop-color='%237c3aed'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='10' fill='%2305060a'/%3E%3Crect x='3' y='3' width='58' height='58' rx='8' fill='none' stroke='url(%23g)' stroke-width='2' opacity='.6'/%3E%3Cpath d='M12 44l14-16 10 8 16-20' fill='none' stroke='url(%23g)' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Exo+2:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --rail-w:78px;
  --bg:#04050a;--void:#000103;--panel:rgba(15,20,36,.6);--panel2:rgba(19,25,44,.72);--raised:rgba(26,33,56,.8);
  --line:rgba(120,175,255,.16);--line2:rgba(140,190,255,.32);--ink:#eaf2ff;--ink2:#7c8aad;
  --win:#00ffa3;--loss:#ff2f6e;--amber:#ffd400;--accent:#00e5ff;--accent2:#7c3aed;--accent3:#ff2fd0;--accent-ink:#001318;
  --shadow:0 30px 80px rgba(0,0,0,.7);
  --glow:0 0 30px color-mix(in srgb,var(--accent) 55%,transparent);
  --cut:14px;
  --display:'Orbitron','Exo 2',sans-serif;--sans:'Exo 2',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--mono:'Share Tech Mono',ui-monospace,'SF Mono',Consolas,monospace;
}
:root[data-theme=light]{
  --bg:#eef3fb;--void:#dfe8f5;--panel:rgba(255,255,255,.72);--panel2:rgba(255,255,255,.88);--raised:#e7eefb;
  --line:rgba(15,35,80,.14);--line2:rgba(15,35,80,.26);--ink:#0a1020;--ink2:#556080;
  --win:#08916a;--loss:#c81854;--amber:#a86200;--accent:#0090a8;--accent2:#5b21b6;--accent3:#a3187a;--accent-ink:#ffffff;
  --shadow:0 22px 60px rgba(20,30,60,.16);--glow:0 0 30px color-mix(in srgb,var(--accent) 20%,transparent);
}
html{scroll-padding-top:80px}
*,*::before,*::after{box-sizing:border-box}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:scale(.94) translateY(6px)}to{opacity:1;transform:none}}
@keyframes sheen{0%{background-position:220% 0}100%{background-position:-220% 0}}
@keyframes ambientDrift{from{transform:translate3d(-2%,-1%,0) scale(1.03)}to{transform:translate3d(2%,1%,0) scale(1.03)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.35}}
@keyframes scan{0%{transform:translateY(-100%)}100%{transform:translateY(100%)}}
@keyframes ringpulse{0%{transform:scale(.9);opacity:.7}70%{transform:scale(1.5);opacity:0}100%{opacity:0}}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.55 var(--sans);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;position:relative}
body::before{content:"";position:fixed;inset:-4%;z-index:-2;pointer-events:none;background:radial-gradient(60% 46% at 90% -8%,color-mix(in srgb,var(--accent) 15%,transparent),transparent 62%),radial-gradient(55% 42% at 0% 6%,color-mix(in srgb,var(--accent2) 14%,transparent),transparent 60%),radial-gradient(40% 30% at 50% 100%,color-mix(in srgb,var(--accent3) 8%,transparent),transparent 65%);animation:ambientDrift 30s ease-in-out infinite alternate}
#starfield{position:fixed;inset:0;z-index:-3;background:var(--void)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4{margin:0;font-weight:600}
h1,h2,h3{font-family:var(--display);letter-spacing:.01em}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.win{color:var(--win)}.loss{color:var(--loss)}.flat{color:var(--ink2)}
.ic{width:18px;height:18px;flex:none}
.muted,.hint{color:var(--ink2)}.hint{font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* ===== glass + cut-corner primitives ===== */
.panel,.tcard,.kpi,.fi,.dlg-card,.modal-card,.auth-card,.banner,.hero{
  clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut));
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
}
.panel,.tcard,.kpi,.fi,.dlg-card,.modal-card,.auth-card{position:relative}
.panel::before,.tcard::before,.kpi::before,.fi::before,.dlg-card::before,.modal-card::before,.auth-card::before{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
  background:linear-gradient(115deg,color-mix(in srgb,var(--accent) 5%,transparent),transparent 40%);
  border:1px solid color-mix(in srgb,var(--accent) 22%,var(--line));
  clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut));
}

/* ===== starfield / warp / rail / cmdk / orb (new shell) ===== */
#warp{position:fixed;inset:0;z-index:200;background:linear-gradient(100deg,transparent,color-mix(in srgb,var(--accent) 60%,transparent),color-mix(in srgb,var(--accent2) 60%,transparent),transparent);opacity:0;pointer-events:none;transform:translateX(-110%)}

#rail{display:none}
@media (min-width:901px){
  body:not(.gated) #rail{display:flex}
  #rail{position:fixed;left:0;top:0;bottom:0;width:var(--rail-w);z-index:32;flex-direction:column;align-items:center;gap:4px;padding:16px 8px;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-right:1px solid var(--line)}
  #rail::after{content:"";position:absolute;top:0;bottom:0;right:-1px;width:1px;background:linear-gradient(var(--accent),transparent 30%,transparent 70%,var(--accent2));opacity:.5}
  #rail .rail-logo{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;margin-bottom:14px;background:conic-gradient(from 210deg,var(--accent),var(--accent2),var(--accent3),var(--accent));filter:drop-shadow(0 0 10px color-mix(in srgb,var(--accent) 60%,transparent));position:relative}
  #rail .rail-logo::after{content:"";position:absolute;inset:5px;border-radius:6px;background:var(--bg)}
  #rail .tab{width:60px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 4px;border-radius:10px;background:none;border:1px solid transparent;color:var(--ink2);font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.04em}
  #rail .tab .ic{width:19px;height:19px}
  #rail .tab:hover{color:var(--ink);border-color:var(--line)}
  #rail .tab.on{color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);border-color:color-mix(in srgb,var(--accent) 45%,transparent);box-shadow:0 0 16px color-mix(in srgb,var(--accent) 25%,transparent)}
  #rail .tab.on .ic{filter:drop-shadow(0 0 6px currentColor)}
  #rail .rail-sp{flex:1}
  body{padding-left:var(--rail-w)}
  .auth,#starfield{padding-left:0}
  body.gated{padding-left:0}
}

.orb{position:fixed;right:22px;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:70;width:58px;height:58px;border-radius:50%;border:1px solid color-mix(in srgb,var(--accent) 50%,var(--line2));background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--accent) 55%,var(--panel)),var(--panel2));color:var(--accent);display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.5),0 0 24px color-mix(in srgb,var(--accent) 35%,transparent)}
.orb .ic{width:24px;height:24px;filter:drop-shadow(0 0 6px currentColor)}
.orb-ring{position:absolute;inset:-6px;border-radius:50%;border:1px solid color-mix(in srgb,var(--accent) 60%,transparent);animation:ringpulse 2.6s ease-out infinite}
body.gated .orb,body.gated #cmdk{display:none}

.cmdk{position:fixed;inset:0;z-index:150;background:rgba(2,3,8,.7);backdrop-filter:blur(4px);display:grid;align-items:start;justify-items:center;padding:12vh 16px}
.cmdk[hidden]{display:none}
.cmdk-box{width:min(620px,100%);background:var(--panel2);border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line2));clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut));backdrop-filter:blur(20px);box-shadow:var(--shadow),0 0 60px color-mix(in srgb,var(--accent) 18%,transparent);animation:popIn .2s cubic-bezier(.16,1,.3,1) both}
.cmdk-in{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.cmdk-in input{background:none;border:0;padding:0;font-size:17px;font-family:var(--mono)}
.cmdk-list{max-height:50vh;overflow:auto;padding:8px}
.cmdk-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:8px;color:var(--ink);font-size:14px}
.cmdk-item .ic{color:var(--accent)}
.cmdk-item:hover,.cmdk-item.sel{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.cmdk-item small{margin-left:auto;color:var(--ink2);font-family:var(--mono);font-size:11px}

/* top HUD strip */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:14px;padding:10px clamp(14px,2.4vw,28px);background:color-mix(in srgb,var(--bg) 74%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);overflow:hidden;min-height:60px}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--accent) 45%,var(--accent2) 55%,transparent);background-size:60% 100%;opacity:.75;animation:sheen 6s linear infinite}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:16px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.brand i{width:22px;height:22px;border-radius:5px;background:conic-gradient(from 210deg,var(--accent),var(--accent2),var(--accent3),var(--accent));display:block;position:relative;filter:drop-shadow(0 0 8px color-mix(in srgb,var(--accent) 65%,transparent))}
.brand i::after{content:"";position:absolute;inset:5px;border-radius:2px;background:var(--bg)}
@media (min-width:901px){.brand{display:none}}
.tabs{display:none}
.top-search{flex:1;max-width:420px;margin-left:auto;position:relative}
.top-search input{display:none}
.top-search::before{content:"⌘K  search commands, trades, journals…";display:flex;align-items:center;gap:8px;width:100%;height:38px;padding:0 14px;border:1px solid var(--line);border-radius:2px;background:var(--panel);color:var(--ink2);font-family:var(--mono);font-size:12.5px;cursor:pointer}
.top-act{display:flex;align-items:center;gap:8px}
.tbtn{position:relative;display:inline-flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:2px;height:38px;padding:0 12px;font-weight:600;font-family:var(--mono);font-size:12.5px;transition:border-color .15s,transform .1s}
.tbtn:hover{border-color:var(--accent);transform:translateY(-1px)}
.tbtn.sq{width:38px;padding:0;justify-content:center}
.tbtn .dot{position:absolute;right:8px;top:8px;width:8px;height:8px;border-radius:50%;background:var(--loss);border:2px solid var(--panel)}
.pl-chip{font-family:var(--display);font-size:14px}
[data-act="settings-open"]:hover .ic{animation:spin .5s ease}
[data-act="chat-open"]:not(.orb){display:none}
.tabbar{display:none}

#main{min-width:0;padding-bottom:60px}
.page{padding:20px clamp(14px,2.4vw,28px) 8px;max-width:1500px;margin:0 auto}
.page-h{margin-bottom:18px;position:relative;padding-left:14px;border-left:2px solid var(--accent)}
.page-h h1{font-size:clamp(20px,2.6vw,28px);line-height:1.15;text-transform:uppercase;letter-spacing:.03em}
.page-h p{margin:6px 0 0;color:var(--ink2);max-width:64ch}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);background:var(--panel2);border-radius:3px;padding:9px 16px;font-weight:700;font-family:var(--sans);text-transform:uppercase;font-size:12.5px;letter-spacing:.03em;transition:background .15s,border-color .15s,transform .1s,box-shadow .15s}
.btn:hover{border-color:var(--accent);box-shadow:0 0 14px color-mix(in srgb,var(--accent) 25%,transparent)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-ink);border-color:transparent;box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent),0 8px 24px color-mix(in srgb,var(--accent) 26%,transparent)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 12px;font-size:11px}
.btn.danger{color:var(--loss)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{border:1px solid var(--line);background:var(--panel2);border-radius:3px;width:36px;height:36px;display:grid;place-items:center;flex:none;transition:border-color .15s,transform .15s,color .15s}
.icon-btn:hover{border-color:var(--accent);color:var(--accent);transform:rotate(-6deg) scale(1.05)}
.icon-btn.sm{width:28px;height:28px}
.icon-btn.sm .ic{width:14px;height:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:3px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:7px 13px;font-size:12px;font-weight:700;color:var(--ink2);font-family:var(--mono);text-transform:uppercase}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:color-mix(in srgb,var(--accent) 16%,var(--raised));color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:12.5px;background:var(--panel);color:var(--ink);font-family:var(--mono)}
button.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:700}
.chip .dot{width:8px;height:8px;border-radius:50%}
.chip.news{border-color:transparent;background:color-mix(in srgb,var(--amber) 16%,transparent);color:var(--amber)}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:8px 11px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink2) 50%),linear-gradient(135deg,var(--ink2) 50%,transparent 50%);background-position:calc(100% - 17px) 55%,calc(100% - 12px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
textarea{resize:vertical;min-height:90px;line-height:1.5}
input[type=checkbox]{width:auto}
input[type=color]{padding:2px;height:36px;width:48px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--ink2);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.badge{display:inline-block;border-radius:3px;padding:2px 8px;font-size:11px;font-weight:700;background:var(--raised);font-family:var(--mono);letter-spacing:.02em;border:1px solid var(--line)}
.badge.win{background:color-mix(in srgb,var(--win) 18%,transparent);border-color:color-mix(in srgb,var(--win) 40%,transparent)}
.badge.loss{background:color-mix(in srgb,var(--loss) 18%,transparent);border-color:color-mix(in srgb,var(--loss) 40%,transparent)}
.panel{background:linear-gradient(150deg,var(--panel2),var(--panel));border:1px solid var(--line);padding:18px;transition:border-color .15s,box-shadow .15s,transform .15s}
.panel:hover{transform:translateY(-1px)}
.panel h3{font-size:15px;margin-bottom:12px;text-transform:uppercase;letter-spacing:.04em;font-family:var(--mono);color:var(--ink2)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.note{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:2px;padding:10px 14px;background:var(--panel);color:var(--ink2);font-size:13.5px}
.note strong{color:var(--ink)}
.note.warn{border-left-color:var(--loss)}
.empty{border:1px dashed var(--line2);padding:32px 18px;text-align:center;color:var(--ink2)}
.empty h3{color:var(--ink);margin-bottom:6px;font-family:var(--display);text-transform:uppercase;letter-spacing:.03em}
.empty .row{justify-content:center;margin-top:14px}

/* dashboard: reflowed grid, work panel first */
.dg{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.c8{grid-column:span 8}.c4{grid-column:span 4;order:-1}.c12{grid-column:span 12}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.hero{display:grid;grid-template-columns:1.3fr 1fr 1fr;padding:0;overflow:hidden;position:relative}
.hero::after{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent2),var(--accent3));opacity:.8}
.hero>div{padding:22px 22px 20px;min-width:0;position:relative}
.hero>div+div{border-left:1px solid var(--line)}
.h-lab{display:flex;align-items:center;gap:8px;color:var(--ink2);font-size:11.5px;font-weight:700;margin-bottom:20px;text-transform:uppercase;letter-spacing:.1em;font-family:var(--mono)}
.h-lab.b::before,.h-lab.w::before{content:"";width:3px;height:14px;background:var(--win)}
.h-lab.w::before{background:var(--loss)}
.big-num{font-family:var(--display);font-size:clamp(30px,4vw,42px);font-weight:700;line-height:1;letter-spacing:0;text-shadow:0 0 26px color-mix(in srgb,currentColor 45%,transparent)}
.h-sub{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:12.5px;font-weight:700;font-family:var(--mono)}
.h-name{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.h-val{font-family:var(--display);font-size:22px;margin-top:6px;display:flex;gap:10px;align-items:baseline}
.h-val small{font-family:var(--mono);font-size:12px;font-weight:700}
.ticks{display:flex;gap:10px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.tick{flex:none;display:inline-flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);padding:8px 13px;font-size:13px;font-weight:700;font-family:var(--mono)}
.tick b{font-weight:700}
.glass{background:radial-gradient(120% 90% at 0% 0%,color-mix(in srgb,var(--accent) 10%,transparent),transparent 60%),linear-gradient(150deg,var(--panel2),var(--panel))}
.work-h{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.work-h h3{margin:0;display:flex;align-items:center;gap:8px}
.work-h h3 .ic{color:var(--accent);filter:drop-shadow(0 0 6px currentColor)}
.focus{margin:10px 0;color:var(--ink2);font-size:13.5px}
.focus b{color:var(--ink)}
.wk-list{margin-top:8px}
.wk{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.wk small{display:block;color:var(--ink2);font-size:12px;font-family:var(--mono)}
.wk-n{width:24px;height:24px;background:var(--raised);border:1px solid var(--line2);display:grid;place-items:center;font-size:12px;font-weight:700;font-family:var(--mono);color:var(--accent)}
.wk-c{font-weight:700}
.ch-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.ch-h .sel{width:auto;min-width:150px}
.ch-legend{display:flex;gap:16px;font-size:12px;color:var(--ink2);margin:0 0 6px;font-family:var(--mono)}
.ch-legend i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px}
svg.eq{width:100%;height:auto;display:block}
svg.eq text{fill:var(--ink2);font-size:11px;font-family:var(--mono)}
.donut-wrap{display:grid;place-items:center;margin:4px 0 8px}
.donut{width:100%;max-width:260px;height:auto;overflow:visible}
.donut .glow{filter:drop-shadow(0 0 12px color-mix(in srgb,var(--accent) 60%,transparent))}
.dn-c{fill:var(--ink);font-family:var(--display);font-size:36px;font-weight:700;text-anchor:middle}
.dn-s{fill:var(--ink2);font-size:11px;text-anchor:middle;font-family:var(--mono)}
.dn-row{display:grid;grid-template-columns:22px 1fr auto auto;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}
.dn-row i{width:10px;height:10px;display:block}
.kt{width:100%;border-collapse:collapse;min-width:680px}
.kt th{font-size:11px;color:var(--accent);font-weight:700;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line2);text-transform:uppercase;letter-spacing:.06em;font-family:var(--mono)}
.kt td{padding:12px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.kt tr:hover td{background:color-mix(in srgb,var(--accent) 4%,transparent)}
.kt tr:last-child td{border-bottom:0}
.kt .r,.kt th.r{text-align:right}
.tbl-scroll{overflow-x:auto}
.meter{position:relative;height:4px;background:linear-gradient(90deg,var(--loss),var(--amber) 52%,var(--win));min-width:110px}
.meter i{position:absolute;top:50%;width:11px;height:11px;border-radius:50%;background:var(--bg);border:2px solid var(--ink);transform:translate(-50%,-50%)}
.edge{font-weight:700;font-size:13px;font-family:var(--mono)}
.bars{display:grid;gap:10px}
.bar-row{display:grid;grid-template-columns:120px 1fr 84px;gap:4px 10px;align-items:center}
.bar-label{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono)}
.bar-track{height:8px;background:var(--raised);overflow:hidden}
.bar-fill{height:100%}
.bar-fill.win{background:linear-gradient(90deg,color-mix(in srgb,var(--win) 60%,transparent),var(--win))}
.bar-fill.loss{background:linear-gradient(90deg,color-mix(in srgb,var(--loss) 60%,transparent),var(--loss))}
.bar-val{text-align:right;font-weight:700;font-size:13px;font-family:var(--mono)}
.bar-sub{grid-column:2 / 4;font-size:12px;color:var(--ink2);margin-top:-2px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);gap:4px;overflow-x:auto;padding-bottom:4px}
.heat i{width:14px;height:14px;background:var(--raised)}
.cmp{width:100%;border-collapse:collapse}
.cmp td,.cmp th{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;font-size:14px}
.cmp th{color:var(--accent);font-weight:700;font-size:12px;font-family:var(--mono);text-transform:uppercase}
.sec-t{display:flex;align-items:center;gap:12px;margin:26px 0 12px;flex-wrap:wrap}
.sec-t h2{font-size:18px;text-transform:uppercase;letter-spacing:.04em}

/* review */
.rev{background:var(--panel);border:1px solid var(--line);padding:14px 16px;margin-top:12px}
.rev h4{font-family:var(--display);font-size:14px;margin:12px 0 3px;text-transform:uppercase;letter-spacing:.03em}
.rev p{margin:3px 0}
.rev ul{margin:3px 0 3px 20px;padding:0}
.rev-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:4px}

/* journal */
.jtabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none}
.jtabs::-webkit-scrollbar{display:none}
.jt{flex:none;display:inline-flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);padding:8px 14px;font-weight:700;font-family:var(--mono);font-size:12.5px}
.jt.on{border-color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent),0 0 14px color-mix(in srgb,var(--accent) 20%,transparent)}
.jt small{color:var(--ink2);font-weight:600}
.jt.add{color:var(--ink2);border-style:dashed}
.banner{position:relative;height:190px;background-size:cover;background-position:center;overflow:hidden;isolation:isolate;border:1px solid var(--line)}
.banner.sm{height:120px}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(2,2,6,.85),rgba(2,2,6,.1) 72%);z-index:1}
.banner-in{position:absolute;left:0;right:0;bottom:0;z-index:2;display:flex;align-items:flex-end;gap:16px;padding:18px 22px;color:#fff}
.banner h1{font-size:clamp(22px,3.4vw,32px);line-height:1.1;text-shadow:0 2px 14px rgba(0,0,0,.5);text-transform:uppercase;letter-spacing:.02em}
.bsub{margin:4px 0 0;opacity:.92;font-size:14px}
.bicon{font-size:38px;line-height:1;filter:drop-shadow(0 4px 10px rgba(0,0,0,.4))}
.banner-act{position:absolute;right:14px;top:14px;z-index:3}
.banner-act .btn{background:rgba(4,5,10,.65);color:#fff;border-color:rgba(255,255,255,.2);backdrop-filter:blur(6px)}
.fx{position:absolute;inset:0;z-index:0;pointer-events:none}
body[data-fx=grain] .banner .fx{background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='160' height='160'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/%3E%3C/filter%3E%3Crect width='160' height='160' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E");mix-blend-mode:overlay;opacity:.5}
body[data-fx=grid] .banner .fx{background-image:linear-gradient(rgba(255,255,255,.14) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.14) 1px,transparent 1px);background-size:28px 28px}
body[data-fx=glow] .banner .fx{background:radial-gradient(420px 220px at 15% 20%,rgba(255,255,255,.26),transparent 70%),radial-gradient(360px 200px at 80% 80%,var(--accent),transparent 70%);animation:drift 14s ease-in-out infinite alternate;opacity:.35}
@keyframes drift{from{transform:translate3d(-3%,0,0)}to{transform:translate3d(4%,-4%,0)}}
body[data-fx=glow]::before,body[data-fx=grid]::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none}
body[data-fx=glow]::before{background:radial-gradient(800px 420px at 92% -8%,color-mix(in srgb,var(--accent) 14%,transparent),transparent 70%)}
body[data-fx=grid]::before{background-image:linear-gradient(color-mix(in srgb,var(--accent) 5%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--accent) 5%,transparent) 1px,transparent 1px);background-size:44px 44px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:16px 0}
.search{max-width:230px;margin-left:auto}
.day{padding:6px 0 18px}
.day-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:14px}
.day-tg{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;font-family:var(--display);font-size:16px;text-transform:uppercase;letter-spacing:.03em}
.day-tg svg{transition:transform .15s}
.day-tg[aria-expanded=false] svg{transform:rotate(-90deg)}
.day-meta{color:var(--ink2);font-size:13px;font-family:var(--mono)}
.day-pnl{margin-left:auto;font-family:var(--display);font-size:18px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
body[data-density=compact] .cards{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.tcard{display:flex;flex-direction:column;text-align:left;padding:0;background:linear-gradient(150deg,var(--panel2),var(--panel));border:1px solid var(--line);overflow:hidden;transition:transform .15s,border-color .15s,box-shadow .15s}
.tcard:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 14px 34px color-mix(in srgb,var(--accent) 22%,transparent)}
.tthumb{position:relative;aspect-ratio:16/10;background:#03050a}
.tthumb img{width:100%;height:100%;object-fit:cover;display:block}
.tthumb .badge{position:absolute;left:10px;top:10px;background:rgba(2,2,6,.82);color:#fff}
.tthumb .badge.win{color:var(--win)}.tthumb .badge.loss{color:var(--loss)}
.tdir{position:absolute;right:10px;top:10px;font-size:11px;background:rgba(2,2,6,.82);color:#fff;padding:2px 8px;font-family:var(--mono);text-transform:uppercase}
.tinfo{padding:12px 14px 14px}
.trow{display:flex;justify-content:space-between;align-items:baseline}
.ttime{color:var(--ink2);font-size:11.5px;font-family:var(--mono)}
.tpnl{font-family:var(--display);font-size:21px;line-height:1.25;margin:2px 0;font-weight:700}
.tsub{display:flex;justify-content:space-between;gap:8px;color:var(--ink2);font-size:12px;font-family:var(--mono)}
.hab-dot{color:var(--loss);white-space:nowrap}
.tbl-wrap{overflow-x:auto}
.tbl-wrap table{width:100%;border-collapse:collapse;min-width:680px}
.tbl-wrap th,.tbl-wrap td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.tbl-wrap th{font-weight:700;color:var(--accent);font-size:11.5px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.04em}
.tbl-wrap tbody tr{cursor:pointer}
.tbl-wrap tbody tr:hover{background:color-mix(in srgb,var(--accent) 5%,transparent)}
td.r,th.r{text-align:right}
.cal-h{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.cal-h h3{font-size:18px;min-width:170px;text-transform:uppercase;letter-spacing:.03em}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-dow{font-size:11px;color:var(--ink2);text-align:center;padding-bottom:4px;font-family:var(--mono);text-transform:uppercase}
.cal-c{min-height:78px;border:1px solid var(--line);background:var(--panel);padding:6px 8px;text-align:left;display:flex;flex-direction:column;justify-content:space-between}
.cal-c.out{opacity:.35}
.cal-c.has{cursor:pointer}
.cal-c.has:hover{border-color:var(--accent)}
.cal-n{font-size:10.5px;color:var(--ink2);font-family:var(--mono)}
.cal-v{font-weight:700;font-size:14px;font-family:var(--mono)}

/* slide-over, drawer, dialog */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:40}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(780px,100%);background:var(--bg);border-left:1px solid var(--line);z-index:50;overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:var(--shadow);animation:slidein .2s cubic-bezier(.16,1,.3,1) both}
@keyframes slidein{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.p-top{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;padding:14px 20px;background:var(--bg);border-bottom:1px solid var(--line)}
.p-title{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.title-in{font-family:var(--display);font-size:22px;border:0;background:transparent;padding:2px 4px;width:9ch;text-transform:uppercase}
.title-in:focus{background:var(--panel)}
.p-body{padding:20px;display:grid;gap:22px}
.shot-main{position:relative;aspect-ratio:16/9;background:#03050a;overflow:hidden;border:1px solid var(--line)}
.shot-main img{width:100%;height:100%;object-fit:contain;display:block}
.shot-note{position:absolute;left:10px;bottom:8px;font-size:12px;color:#9aa;background:rgba(2,2,6,.75);padding:2px 8px;font-family:var(--mono)}
.shot-strip{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.shot-strip button{width:84px;aspect-ratio:16/10;padding:0;border:2px solid var(--line);overflow:hidden;background:#03050a}
.shot-strip button.on{border-color:var(--accent)}
.shot-strip img{width:100%;height:100%;object-fit:cover}
.shot-act{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.sec-h{font-family:var(--display);font-size:15px;margin-bottom:8px;text-transform:uppercase;letter-spacing:.03em}
.hab-chips{display:flex;flex-wrap:wrap;gap:8px}
.vdrop{display:grid;gap:8px;justify-items:start;border:1px dashed var(--line2);padding:16px;background:var(--panel)}
ul.conf{margin:0 0 10px;padding:0 0 0 22px;list-style:disc}
ul.conf li{display:list-item;margin:6px 0;padding-left:4px}
ul.conf li::marker{color:var(--accent);font-size:1.2em}
.conf-row{display:flex;gap:8px;align-items:center}
.conf-row input{background:transparent;border-color:transparent;padding:6px 8px}
.conf-row input:hover,.conf-row input:focus{background:var(--panel);border-color:var(--line)}
video.vid{width:100%;background:#000;max-height:380px}
.ai-out{margin-top:12px;background:var(--panel);border:1px solid var(--line);padding:14px}
.ai-out h4{font-family:var(--display);font-size:14px;margin:10px 0 4px;text-transform:uppercase}
.ai-out p{margin:4px 0}
.ai-out ul{margin:4px 0 4px 18px;padding:0}
.annot{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.annot time{color:var(--ink2);font-family:var(--mono)}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);z-index:60;background:var(--panel2);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-left:1px solid color-mix(in srgb,var(--accent) 30%,var(--line2));display:flex;flex-direction:column;transform:translateX(102%);transition:transform .25s cubic-bezier(.16,1,.3,1);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:var(--shadow),-30px 0 70px -30px color-mix(in srgb,var(--accent) 30%,transparent)}
#drawer.open{transform:none}
.d-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.d-h h3{font-size:16px;flex:1;font-family:var(--display);text-transform:uppercase;letter-spacing:.04em}
#chatlog{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:92%;padding:10px 13px;background:var(--raised);border:1px solid var(--line)}
.msg.me{align-self:flex-end;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-ink);border-color:transparent}
.msg p{margin:0 0 6px}.msg p:last-child{margin:0}
.msg h4{font-family:var(--display);font-size:14px;margin:6px 0 2px}
.msg ul{margin:4px 0 4px 18px;padding:0}
.d-f{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px}
.sugg{display:flex;flex-wrap:wrap;gap:8px}
.dlg{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.68);display:grid;place-items:center;padding:16px}
.dlg[hidden]{display:none}
.dlg-card{background:var(--panel2);border:1px solid color-mix(in srgb,var(--accent) 25%,var(--line2));width:min(680px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:var(--shadow),0 0 60px color-mix(in srgb,var(--accent) 12%,transparent)}
.dlg-h{position:sticky;top:0;background:var(--panel2);display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);z-index:1}
.dlg-h h3{flex:1;font-size:16px;margin:0;font-family:var(--display);text-transform:uppercase;letter-spacing:.03em}
.dlg-b{padding:18px 20px;display:grid;gap:20px}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.sw button{width:32px;height:32px;border-radius:50%;border:2px solid transparent;outline:1px solid var(--line2)}
.sw button[aria-pressed=true]{border-color:var(--panel);outline:2px solid var(--ink)}
.bn{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.bn button{height:50px;border-radius:2px;border:2px solid transparent;outline:1px solid var(--line2)}
.bn button[aria-pressed=true]{border-color:var(--panel);outline:2px solid var(--ink)}
.opt{display:flex;flex-wrap:wrap;gap:8px}

/* backtest */
.bt{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:16px;align-items:start}
.screen{position:relative;aspect-ratio:16/9;background:#020306;border:1px solid var(--line);overflow:hidden;display:grid;place-items:center;text-align:center;color:var(--ink2)}
.screen.sm{max-width:560px}
.screen video{width:100%;height:100%;object-fit:contain;background:#000}
.rec{position:absolute;left:12px;top:12px;display:flex;align-items:center;gap:8px;background:rgba(2,2,6,.85);color:#fff;padding:4px 12px;font-size:12px;font-family:var(--mono)}
.rec i{width:9px;height:9px;border-radius:50%;background:var(--loss);animation:pulse 1.4s infinite}
.mic.live{background:var(--loss);color:#fff;border-color:transparent}
.cmd{display:flex;gap:8px;margin-top:12px}
.heard{min-height:24px;margin-top:8px;color:var(--ink2);font-size:14px;font-family:var(--mono)}
.log{display:flex;flex-direction:column;gap:8px;max-height:260px;overflow:auto}
.log div{font-size:13px;padding:7px 10px;background:var(--raised);font-family:var(--mono)}
.log .ok{border-left:3px solid var(--win)}.log .warn{border-left:3px solid var(--loss)}.log .you{border-left:3px solid var(--accent)}
.log time{color:var(--ink2);font-size:11.5px;margin-right:6px}
.mini{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--raised);border:1px solid var(--line);padding:6px;margin-top:8px}
.mini .th{width:64px;aspect-ratio:16/10;overflow:hidden;background:#03050a;flex:none}
.mini img{width:100%;height:100%;object-fit:cover;display:block}
.cmds{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin:0;padding:0;list-style:none}
.cmds li{background:var(--raised);padding:10px 12px;font-size:13px;border:1px solid var(--line)}
.cmds b{display:block;margin-bottom:2px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);padding:12px 14px;transition:border-color .15s,transform .15s}
.kpi:hover{border-color:var(--accent);transform:translateY(-2px)}
.kpi small{display:block;color:var(--ink2);font-size:11px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.03em}
.kpi b{font-family:var(--display);font-size:22px;font-weight:700;line-height:1.3}
.inpage .toolbar{padding-top:6px}

/* habits, news */
.habit{display:grid;grid-template-columns:minmax(150px,1.4fr) repeat(2,minmax(80px,.7fr)) 120px 110px 40px;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.habit.head{color:var(--accent);font-size:11px;font-weight:700;font-family:var(--mono);text-transform:uppercase}
.habit small{display:block;color:var(--ink2);font-size:12px;font-family:var(--mono)}
.hl{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--loss);padding:14px 16px;margin-bottom:16px}
.hl strong{font-family:var(--display);font-weight:700;font-size:17px}
.ev-day{margin-top:20px}
.ev-day h3{font-size:16px;margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em}
.ev{display:grid;grid-template-columns:62px 52px 44px minmax(160px,1fr) repeat(2,72px) 38px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.ev.past{opacity:.55}
.ev .k{font-size:10.5px;color:var(--ink2);font-family:var(--mono);text-transform:uppercase}
.ev .v{font-weight:700}
.imp{display:inline-flex;gap:3px;align-items:center}
.imp i{width:9px;height:9px;border-radius:50%;background:var(--line2)}
.imp.high i{background:var(--loss)}
.imp.medium i:nth-child(-n+2){background:var(--amber)}
.est{font-size:10px;color:var(--ink2);border:1px solid var(--line2);padding:0 4px;margin-left:4px;font-family:var(--mono)}
.cd{font-family:var(--display);font-size:28px;font-weight:700;text-shadow:0 0 20px color-mix(in srgb,var(--accent) 45%,transparent)}
.mv{padding:12px 14px;border:1px solid var(--line);background:var(--panel);margin-top:8px;font-size:14px}
.mv small{color:var(--ink2);display:block;margin-bottom:2px;font-family:var(--mono)}
.mv mark{background:color-mix(in srgb,var(--amber) 30%,transparent);color:inherit;padding:0 2px}
.stack{display:grid;gap:18px}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}

/* modal + toasts */
#modal{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.68);display:grid;place-items:center;padding:16px}
#modal[hidden]{display:none}
.modal-card{background:var(--panel2);border:1px solid color-mix(in srgb,var(--accent) 25%,var(--line2));padding:20px;width:min(420px,100%);display:grid;gap:12px;box-shadow:var(--shadow),0 0 60px color-mix(in srgb,var(--accent) 12%,transparent)}
.modal-card h3{font-size:17px;font-family:var(--display);text-transform:uppercase}.modal-card p{margin:0;color:var(--ink2)}
.modal-act{display:flex;justify-content:flex-end;gap:8px}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:100;display:grid;gap:8px;width:min(460px,calc(100% - 24px))}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;box-shadow:var(--shadow);font-size:14px;font-weight:700;font-family:var(--mono)}

function md(src){
  const inl=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  let out='',ul=false;
  for(const raw of String(src||'').split('\n')){
    const l=raw.trim();
    if(/^[-*]\s+/.test(l)){if(!ul){out+='<ul>';ul=true}out+='<li>'+inl(l.replace(/^[-*]\s+/,''))+'</li>';continue}
    if(ul){out+='</ul>';ul=false}
    if(!l)continue;
    const h=l.match(/^#{1,4}\s+(.*)/);
    out+=h?'<h4>'+inl(h[1])+'</h4>':'<p>'+inl(l)+'</p>';

const activeJournal=()=>S.journals.find(j=>j.id===S.ui.journal&&!isBt(j))||S.journals.find(j=>!isBt(j))||S.journals[0];
function btJournal(){let j=S.journals.find(isBt);if(!j){j=newBtJournal();if(S.journals.some(x=>x.id===j.id))j.id=uid('j');S.journals.push(j);persist()}return j}
const jOf=t=>S.journals.find(j=>j.id===t.journalId);
const fs=j=>isBt(j)?S.ui.bt:S.ui;
function scopeTrades(sc){
  if(sc==='all')return S.trades;
  if(sc==='live')return S.trades.filter(t=>!isBt(jOf(t)));
  if(sc==='bt')return S.trades.filter(t=>isBt(jOf(t)));
  return S.trades.filter(t=>t.journalId===sc);
}
function scopeName(sc){
  if(sc==='all')return 'Everything';if(sc==='live')return 'All live journals';if(sc==='bt')return 'Backtest journal';
  return (S.journals.find(j=>j.id===sc)||{name:'Deleted journal'}).name;
}
function scopeOptions(sel,withAll=true){
  return `<option value="live" ${sel==='live'?'selected':''}>All live journals</option><option value="bt" ${sel==='bt'?'selected':''}>Backtest journal</option>${withAll?`<option value="all" ${sel==='all'?'selected':''}>Everything</option>`:''}`+S.journals.filter(j=>!isBt(j)).map(j=>`<option value="${j.id}" ${sel===j.id?'selected':''}>${esc(j.name)}</option>`).join('');
}
const tradesOf=jid=>S.trades.filter(t=>t.journalId===jid);
const confRows=ts=>{const m={};ts.filter(t=>!t.open).forEach(t=>(t.confluences||[]).forEach(c=>{(m[c]=m[c]||[]).push(t)}));return Object.keys(m).map(k=>({label:k,n:m[k].length,pnl:m[k].reduce((a,t)=>a+t.pnl,0),winRate:m[k].filter(t=>t.pnl>0).length/m[k].length})).sort((a,b)=>b.pnl-a.pnl)};
const closed=t=>!t.open;
const habitOf=id=>S.habits.find(h=>h.id===id);
const habitNames=t=>(t.habits||[]).map(id=>habitOf(id)).filter(Boolean).map(h=>h.name);
const cmpAsc=(a,b)=>(a.date+a.time).localeCompare(b.date+b.time);
function resultOf(t){if(t.open)return{l:'Open',c:'flat'};if(t.pnl>0)return{l:'Win',c:'win'};if(t.pnl<0)return{l:'Loss',c:'loss'};return{l:'Breakeven',c:'flat'}}
function sessionOf(time){const h=Math.floor(mins(time)/60);if(h>=19||h<3)return'Asia';if(h<8)return'London';if(h<17)return'New York';return'After hours'}
function bucketOf(time){const m=mins(time);return m<570?'Pre-market':m<660?'Open (9:30-11)':m<840?'Midday (11-2)':'Afternoon (after 2)'}
function nearNews(t){return eventsForDate(t.date).filter(e=>e.country==='USD'&&(e.impact==='high'||e.impact==='medium')&&Math.abs(mins(e.time)-mins(t.time))<=20)}

function stats(all){
  const ts=all.filter(closed);
  const n=ts.length, wins=ts.filter(t=>t.pnl>0), losses=ts.filter(t=>t.pnl<0);
  const gp=sum(wins.map(t=>t.pnl)), gl=Math.abs(sum(losses.map(t=>t.pnl))), total=gp-gl;
  const sorted=[...ts].sort(cmpAsc); let eq=0,peak=0,dd=0; const curve=[];
  for(const t of sorted){eq+=t.pnl;peak=Math.max(peak,eq);dd=Math.max(dd,peak-eq);curve.push({t,eq})}
  const byDay={}; ts.forEach(t=>{byDay[t.date]=(byDay[t.date]||0)+t.pnl});
  const days=Object.entries(byDay);
  return{n,wins:wins.length,losses:losses.length,winRate:n?wins.length/n:0,avgWin:wins.length?gp/wins.length:0,avgLoss:losses.length?gl/losses.length:0,
    pf:gl?gp/gl:(gp?Infinity:0),exp:n?total/n:0,total,dd,curve,byDay,
    best:days.length?days.reduce((a,b)=>b[1]>a[1]?b:a):null,worst:days.length?days.reduce((a,b)=>b[1]<a[1]?b:a):null,
    flags:sum(ts.map(t=>(t.habits||[]).length))};
}
function groupRows(ts,keyFn,order){
  const m={}; ts.filter(closed).forEach(t=>{const k=keyFn(t);(m[k]=m[k]||[]).push(t)});
  let keys=Object.keys(m); if(order)keys=order.filter(k=>m[k]).concat(keys.filter(k=>!order.includes(k)));
  return keys.map(k=>({label:k,n:m[k].length,pnl:sum(m[k].map(t=>t.pnl)),winRate:m[k].filter(t=>t.pnl>0).length/m[k].length}));
}
function habitTable(ts){
  return S.habits.map(h=>{const tt=ts.filter(t=>closed(t)&&(t.habits||[]).includes(h.id));return{id:h.id,name:h.name,color:h.color,n:tt.length,cost:sum(tt.map(t=>t.pnl)),last:tt.length?tt.map(t=>t.date).sort().pop():null}});
}
function inRange(ts,range){
  if(range==='all')return ts;
  const days=Number(range); const d=new Date();d.setDate(d.getDate()-days);const cut=iso(d);
  return ts.filter(t=>t.date>=cut);
}
const weekStart=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x};

/* ---------- generated sample chart ---------- */
const svgCache=new Map();
function chartSvg(seed,dir,win){
  const key=seed+dir+win; if(svgCache.has(key))return svgCache.get(key);
  const r=rng(seed),W=480,H=300,N=42,entry=26,sign=dir==='long'?1:-1,c=[]; let p=0;
  for(let i=0;i<N;i++){
    let drift=0; if(i>entry)drift=(win?1:-1)*sign*.55; else if(i>10)drift=-sign*.12;
    const o=p,cl=p+drift+(r()-.5)*2.2,hi=Math.max(o,cl)+r()*1.1,lo=Math.min(o,cl)-r()*1.1; c.push([o,cl,hi,lo]); p=cl;
  }
  const all=c.flat(),mn=Math.min(...all),mx=Math.max(...all),y=v=>16+(1-(v-mn)/(mx-mn||1))*(H-32),cw=(W-40)/N;
  let g='';for(let i=1;i<6;i++){const yy=(16+i*(H-32)/6).toFixed(1);g+=`<line x1="0" x2="${W}" y1="${yy}" y2="${yy}" stroke="#16303f"/>`}
  let k='';c.forEach((q,i)=>{const x=20+i*cw+cw/2,col=q[1]>=q[0]?'#52d3a8':'#f2766b';k+=`<line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${y(q[2]).toFixed(1)}" y2="${y(q[3]).toFixed(1)}" stroke="${col}"/><rect x="${(x-cw*.32).toFixed(1)}" y="${y(Math.max(q[0],q[1])).toFixed(1)}" width="${(cw*.64).toFixed(1)}" height="${Math.max(1.5,Math.abs(y(q[0])-y(q[1]))).toFixed(1)}" fill="${col}"/>`});
  const ey=y(c[entry][1]).toFixed(1),ex=(20+entry*cw+cw/2).toFixed(1);
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}"><rect width="${W}" height="${H}" fill="#0b1922"/>${g}${k}<line x1="${ex}" x2="${W}" y1="${ey}" y2="${ey}" stroke="#f0b04a" stroke-dasharray="4 4"/><circle cx="${ex}" cy="${ey}" r="4.5" fill="#f0b04a"/></svg>`;
  const uri='data:image/svg+xml;utf8,'+encodeURIComponent(svg); svgCache.set(key,uri); return uri;
}
function thumb(t,idx=0){
  const id=(t.imageIds||[])[idx];
  if(id)return `<img alt="Screenshot of ${esc(t.symbol)} trade" data-media="${id}" loading="lazy">`;
  return `<img alt="Sample chart for ${esc(t.symbol)} trade" src="${chartSvg(t.seed,t.direction,t.pnl>0)}" loading="lazy">`;
}

/* ---------- toast + modal ---------- */
function toast(msg){const el=document.createElement('div');el.className='toast';el.textContent=msg;$('#toasts').appendChild(el);setTimeout(()=>el.remove(),4200)}
function ask(title,o={}){
  return new Promise(res=>{
    const m=$('#modal'),lastFocus=document.activeElement;
    m.innerHTML=`<div class="modal-card" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h3>${esc(title)}</h3>${o.message?`<p>${esc(o.message)}</p>`:''}${o.confirmOnly?'':`<input id="mval" type="${o.password?'password':'text'}" autocomplete="${o.password?'current-password':'off'}" value="${esc(o.value||'')}" placeholder="${esc(o.placeholder||'')}">`}<div class="modal-act"><button class="btn ghost" data-m="no">Cancel</button><button class="btn ${o.danger?'danger':'primary'}" data-m="ok">${esc(o.okLabel||'Save')}</button></div></div>`;
    m.hidden=false;
    const inp=$('#mval',m);(inp||$('[data-m=ok]',m)).focus();
    const done=v=>{m.hidden=true;m.innerHTML='';m.onclick=null;m.onkeydown=null;if(lastFocus&&lastFocus.focus)lastFocus.focus();res(v)};
    m.onclick=e=>{const b=e.target.closest('[data-m]');if(b)done(b.dataset.m==='ok'?(inp?inp.value.trim():true):null);else if(e.target===m)done(null)};
    m.onkeydown=e=>{if(e.key==='Escape')done(null);if(e.key==='Enter'&&inp)done(inp.value.trim())};
  });
}

/* ---------- AI plumbing ---------- */
let AI=null, AICAPS=null, aiSource='';
function useKeyAI(){
  const st=S&&S.settings;if(!st||AI)return;
  if(st.apiKey){AI=makeKeyAI(st.apiKey);AICAPS={images:{maxCount:3}};aiSource='key'}
  else if(typeof cloud!=='undefined'&&cloud.unlockedKey){AI=makeKeyAI(cloud.unlockedKey);AICAPS={images:{maxCount:3}};aiSource='key'}
  else if(st.apiKeyEnc){aiSource='locked'}
}
function startClaude(){
  let viaClaude=false;
  try{
    if(window.claude&&window.claude.use){
      viaClaude=true;
      window.claude.use('sample').then(s=>{if(s){AI=s;aiSource='claude';if(s.limits)s.limits().then(l=>{AICAPS=l}).catch(()=>{})}else useKeyAI()}).catch(()=>useKeyAI());
    }
  }catch(e){}
  if(!viaClaude)useKeyAI();
}
let aiLock=false;
const aiBegin=()=>{if(aiLock){toast('The AI is still working on your last request. Give it a moment.');return false}aiLock=true;return true};
const aiEnd=()=>{aiLock=false};
function aiErr(e){
  const key=aiSource==='key';
  switch(e&&e.code){
    case'cancelled':return'';
    case'not_granted':return key?`Anthropic says that key is invalid${e.message?' ("'+e.message+'")':''}. Common causes: a character missing or added when copying, the key's name pasted instead of the key itself, or a revoked key. Create a new key in the Anthropic Console (API keys), copy it in full right away, and paste it again.`:'AI access was declined. Reload the page to be asked again.';
    case'needs_workspace':return "Your API key isn't tied to a workspace, so Anthropic needs to know which one to use. Easiest fix: create a new key in the Anthropic Console and choose a specific workspace for it, then paste it here. Or paste your workspace ID (it starts with wrkspc_) into Settings, in the Workspace ID box.";
    case'no_credit':return 'Your Anthropic API account is out of credit. Add credit in the Anthropic Console, then try again.';
    case'model_unavailable':return "Your API key can't use the AI model this site asks for. Check your Anthropic account's model access.";
    case'rate_limited':return key?'Anthropic says too many requests are coming in right now. Wait a moment and try again.':'The AI is busy or at its limit. This can happen when this page is open in another tab, or when your Claude usage limit has been reached. Close other copies and try again in a few minutes.';
    case'prompt_too_large':return'Too much data to send at once. Try a shorter date range.';
    case'invalid_json':return'The AI reply could not be read. Try again.';
    default:return key&&e&&e.message?`The AI request failed (${e.message}). Try again.`:'The AI request failed. Try again.';
  }
}
const aiMissing=()=>{
  if(aiSource==='locked'){unlockKey().then(ok=>{if(ok)toast('Unlocked. Tap the button again.')});return}
  toast(window.claude?'AI is not available in this view. Open the published page in Claude to use it.':'AI is not connected yet. Add your API key in Settings to use it.');
};
function compact(ts){
  return ts.map(t=>{const j=jOf(t);return [j?j.name:'',t.date,t.time,t.symbol,t.direction,t.setup||'',t.risk,t.open?'open':Math.round(t.pnl),habitNames(t).join('|'),(t.confluences||[]).join('|')].join(',')}).join('\n');
}
function statLine(s){return `${s.n} closed trades, total P&L ${Math.round(s.total)}, win rate ${pct(s.winRate)}, profit factor ${fmtPF(s.pf)}, avg win ${Math.round(s.avgWin)}, avg loss ${Math.round(s.avgLoss)}, max drawdown ${Math.round(s.dd)}`}
function dataContext(){
  const parts=S.journals.map(j=>`Journal "${j.name}" (${isBt(j)?'backtest':'live'}): ${statLine(stats(tradesOf(j.id)))}`);
  const hab=habitTable(S.trades).map(h=>`${h.name}: ${h.n} flags, P&L when flagged ${Math.round(h.cost)}`);
  const cf=confRows(S.trades).map(c=>`${c.label}: ${c.n} trades, P&L ${Math.round(c.pnl)}, win rate ${pct(c.winRate)}`);
  return parts.join('\n')+'\nHabits:\n'+hab.join('\n')+'\nConfluences:\n'+cf.join('\n')+'\nTrades (journal,date,time,symbol,direction,setup,risk,pnl,habits,confluences):\n'+compact(S.trades.filter(closed).sort(cmpAsc).slice(-80));
}

/* ---------- JOURNAL VIEWS (live journals and the backtest journal share these) ---------- */
function iconHtml(j,size){

function bannerStyle(j){

  if(b.type==='image'&&b.value)return `background-image:url('${b.value}')`;
  return `background-image:${b.value||BANNERS[0]}`;
}
function bannerHtml(j,sub,sm){
  return `<div class="banner ${sm?'sm':''}" style="${bannerStyle(j)}"><div class="fx"></div><div class="banner-act"><button class="btn sm" data-act="cust-open" data-j="${j.id}">${icon('gear')}Customize</button></div><div class="banner-in"><span class="bicon">${iconHtml(j,46)}</span><div><h1>${esc(j.name)}</h1><p class="bsub">${sub}</p></div></div></div>${j.desc?`<p class="jdesc">${esc(j.desc)}</p>`:''}`;
}
function filteredTrades(j){
  let ts=tradesOf(j.id);const u=fs(j);
  if(u.resultFilter==='win')ts=ts.filter(t=>!t.open&&t.pnl>0);
  if(u.resultFilter==='loss')ts=ts.filter(t=>!t.open&&t.pnl<0);
  if(u.q){const q=u.q.toLowerCase();ts=ts.filter(t=>[t.symbol,t.setup,t.details,t.outliers,t.direction,habitNames(t).join(' '),(t.confluences||[]).join(' ')].join(' ').toLowerCase().includes(q))}
  if(u.day)ts=ts.filter(t=>t.date===u.day);
  return ts;
}
function toolbarHtml(j){

  const eff=isBt(j)&&j.layout==='gallery'?'feed':j.layout,lay=(k,l)=>`<button data-act="layout" data-l="${k}" ${d} aria-pressed="${eff===k}">${l}</button>`;
  const rf=(k,l)=>`<button data-act="rf" data-r="${k}" ${d} aria-pressed="${u.resultFilter===k}">${l}</button>`;
  return `<div class="toolbar"><button class="btn primary" data-act="new-trade" ${d}>${isBt(j)?'New entry':'New trade'}</button>
  <div class="seg" role="group" aria-label="Layout">${isBt(j)?lay('feed','Feed'):lay('gallery','Gallery')}${lay('table','Table')}${lay('calendar','Calendar')}</div>
  <div class="seg" role="group" aria-label="Filter by result">${rf('all','All')}${rf('win','Wins')}${rf('loss','Losses')}</div>

  <input class="search" type="search" placeholder="Search entries" value="${esc(u.q)}" data-in="q" ${d} aria-label="Search entries"></div>`;
}
function vJournal(){
  const j=activeJournal(),ts=tradesOf(j.id),st=stats(ts),live=S.journals.filter(x=>!isBt(x));
  const tabs=`<div class="jtabs" role="tablist" aria-label="Journals">${live.map(x=>`<button class="jt ${x.id===j.id?'on':''}" role="tab" aria-selected="${x.id===j.id}" data-act="pick-journal" data-id="${x.id}"><span class="jic">${iconHtml(x,20)}</span>${esc(x.name)}<small>${tradesOf(x.id).length}</small></button>`).join('')}<button class="jt add" data-act="new-journal">${icon('plus')}New journal</button></div>`;
  return `<div class="page">${tabs}${bannerHtml(j,`${ts.length} trades, ${money(st.total)} total, ${pct(st.winRate)} win rate`)}
  ${S.demo&&!S.ui.demoDismissed?`<div style="margin-top:14px"><div class="note"><strong>You're looking at sample trades.</strong> Everything here is made up so you can try the app. <span class="row" style="display:inline-flex;margin-left:8px"><button class="btn sm" data-act="clear-demo">Clear sample data</button><button class="btn ghost sm" data-act="dismiss-demo">Keep for now</button></span></div></div>`:''}
  ${toolbarHtml(j)}<div id="jbody" data-j="${j.id}">${jBody(j)}</div></div>`;

function jBody(j){
  if(j.layout==='calendar')return tCal(j);
  const ts=filteredTrades(j);
  if(!ts.length){
    const any=tradesOf(j.id).length,bt=isBt(j);
    return `<div class="empty"><h3>${any?'Nothing matches these filters':bt?'No backtest entries yet':'This journal has no trades yet'}</h3><div>${any?'Clear the search or filters to see everything.':bt?'Say “log this trade, long, risked 100” or walk through a trade above, and it lands here.':'Log one by hand, or start from the Backtest tab.'}</div><div class="row"><button class="btn primary" data-act="new-trade" data-j="${j.id}">${bt?'New entry':'New trade'}</button></div></div>`;
  }
  const lay=isBt(j)&&j.layout==='gallery'?'feed':j.layout;
  return lay==='table'?tTable(ts):lay==='feed'?tFeed(ts):tGallery(ts);
}
function card(t){
  const r=resultOf(t),cf=(t.confluences||[]).length;
  return `<button class="tcard" data-act="open-trade" data-id="${t.id}"><div class="tthumb">${thumb(t)}<span class="badge ${r.c}">${r.l}</span><span class="tdir">${t.direction==='long'?'Long':'Short'}</span></div><div class="tinfo"><div class="trow"><strong>${esc(t.symbol)}</strong><span class="ttime">${esc(t.time)}</span></div><div class="tpnl ${r.c}">${t.open?'Open':money(t.pnl)}</div><div class="tsub"><span>${t.risk?'Risk '+money(t.risk,false):'No risk set'}${cf?`, ${cf} confluence${cf>1?'s':''}`:''}</span>${(t.habits||[]).length?`<span class="hab-dot" title="${esc(habitNames(t).join(', '))}">${t.habits.length} habit flag${t.habits.length>1?'s':''}</span>`:''}</div></div></button>`;
}

function briefText(t){const l=String(t.details||'').split('\n').map(x=>x.replace(/^[-*•]\s*/,'').trim()).filter(x=>x&&!/^confluences:/i.test(x))[0]||'';return l.length>200?l.slice(0,197)+'...':l}
function feedItem(t){
  const r=resultOf(t),R=!t.open&&t.risk?t.pnl/t.risk:null,cf=(t.confluences||[]).slice(0,4),hb=[...new Set([...(t.bad||[]).slice(0,2),...habitNames(t)])];
  return `<button class="fi" data-act="open-trade" data-id="${t.id}"><div class="fi-img">${thumb(t)}</div><div class="fi-b">
   <div class="fi-h"><b style="font-size:16px">${esc(t.symbol)}</b><span class="chip">${t.direction==='long'?'Long':'Short'}</span><span class="badge ${r.c}">${r.l}</span><span class="muted" style="font-size:13px">${esc(t.time)}</span></div>
   <div class="fi-stats"><span><small>Risk</small><b>${t.risk?money(t.risk,false):'—'}</b></span><span><small>P&amp;L</small><b class="${r.c}">${t.open?'Open':money(t.pnl)}</b></span><span><small>R multiple</small><b>${R==null?'—':R.toFixed(2)+'R'}</b></span>${t.setup?`<span><small>Setup</small><b style="font-size:14px;font-family:var(--sans)">${esc(t.setup)}</b></span>`:''}</div>
   ${briefText(t)?`<p class="fi-sum">${esc(briefText(t))}</p>`:''}
   ${cf.length||hb.length?`<div class="fi-tags">${cf.map(c=>`<span class="chip">${esc(c)}</span>`).join('')}${(t.confluences||[]).length>4?`<span class="chip">+${t.confluences.length-4}</span>`:''}${hb.map(h=>`<span class="chip" style="color:var(--loss)">${esc(h)}</span>`).join('')}</div>`:''}</div></button>`;

function tFeed(ts){
  const groups={};ts.forEach(t=>{(groups[t.date]=groups[t.date]||[]).push(t)});
  return Object.keys(groups).sort().reverse().map(d=>{
    const g=groups[d].sort((a,b)=>b.time.localeCompare(a.time)),st=stats(g);
    return `<section class="day"><header class="day-h"><span class="day-tg" style="cursor:default">${esc(fmtDay(d))}</span><span class="day-meta">${g.length} ${g.length>1?'entries':'entry'}, ${st.wins} won, ${st.losses} lost</span><span class="day-pnl ${cls(st.total)}">${money(st.total)}</span></header><div class="feed">${g.map(feedItem).join('')}</div></section>`;
  }).join('');
}
function tGallery(ts){
  const groups={};ts.forEach(t=>{(groups[t.date]=groups[t.date]||[]).push(t)});
  return Object.keys(groups).sort().reverse().map(d=>{
    const g=groups[d].sort((a,b)=>b.time.localeCompare(a.time)),st=stats(g),col=S.ui.collapsed[d];

  }).join('');
}
function tTable(ts){
  const rows=[...ts].sort((a,b)=>cmpAsc(b,a));
  return `<div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Time</th><th>Symbol</th><th>Direction</th><th>Setup</th><th class="r">Risk</th><th class="r">P&amp;L</th><th class="r">R</th><th class="r">Confluences</th><th class="r">Habit flags</th></tr></thead><tbody>${rows.map(t=>`<tr data-act="open-trade" data-id="${t.id}" tabindex="0"><td>${esc(fmtDay(t.date))}</td><td>${esc(t.time)}</td><td><strong>${esc(t.symbol)}</strong></td><td>${t.direction==='long'?'Long':'Short'}</td><td>${esc(t.setup||'')}</td><td class="r">${t.risk?money(t.risk,false):''}</td><td class="r ${resultOf(t).c}">${t.open?'Open':money(t.pnl)}</td><td class="r">${!t.open&&t.risk?(t.pnl/t.risk).toFixed(1)+'R':''}</td><td class="r">${(t.confluences||[]).length||''}</td><td class="r">${(t.habits||[]).length||''}</td></tr>`).join('')}</tbody></table></div>`;
}
function tCal(j){
  const ts=tradesOf(j.id),first=parseISO(S.ui.calMonth),y=first.getFullYear(),m=first.getMonth();
  const start=new Date(y,m,1-first.getDay()),by={};ts.forEach(t=>{(by[t.date]=by[t.date]||[]).push(t)});
  let cells='';
  for(let i=0;i<42;i++){
    const d=new Date(start);d.setDate(start.getDate()+i);const ds=iso(d),g=by[ds],out=d.getMonth()!==m;
    if(i>=35&&out&&i%7===0)break;
    const st=g?stats(g):null;
    cells+=g?`<button class="cal-c has ${out?'out':''}" data-act="cal-day" data-d="${ds}" data-j="${j.id}" aria-label="${esc(fmtDay(ds))}, ${g.length} entries, ${money(st.total)}"><span class="cal-n">${d.getDate()}</span><span><span class="cal-v ${cls(st.total)}">${money(st.total)}</span><br><span class="cal-n cal-cnt">${g.length} ${g.length>1?'entries':'entry'}</span></span></button>`:`<div class="cal-c ${out?'out':''}"><span class="cal-n">${d.getDate()}</span></div>`;
  }
  const month=sum(ts.filter(t=>{const d=parseISO(t.date);return d.getFullYear()===y&&d.getMonth()===m&&closed(t)}).map(t=>t.pnl));
  return `<div class="cal"><div class="cal-h"><button class="icon-btn" data-act="cal-prev" aria-label="Previous month">${icon('chev').replace('<svg','<svg style="transform:rotate(90deg)"')}</button><h3>${first.toLocaleDateString('en-US',{month:'long',year:'numeric'})}</h3><button class="icon-btn" data-act="cal-next" aria-label="Next month">${icon('chev').replace('<svg','<svg style="transform:rotate(-90deg)"')}</button><span class="${cls(month)}" style="margin-left:auto;font-weight:700">${money(month)} this month</span></div><div class="cal-g">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="cal-dow">${x}</div>`).join('')}${cells}</div></div>`;
}

/* ---------- WHAT TO WORK ON ---------- */
const workAI={};
function workOnPanel(ts,scopeLabel,key,scope){
  const tab=habitTable(ts).filter(h=>h.n).sort((a,b)=>(a.cost-b.cost)||(b.n-a.n)).slice(0,3);
  const tb=groupRows(ts,t=>bucketOf(t.time)).sort((a,b)=>a.pnl-b.pnl),cr=confRows(ts).filter(r=>r.n>=2);
  const today=new Date();today.setHours(0,0,0,0);
  const since=d=>{if(!d)return '';const n=Math.round((today-parseISO(d))/864e5);return n===0?'today':n===1?'yesterday':n+' days ago'};
  const top=tab[0];
  const focus=top&&top.cost<0?`Before each entry, ask yourself whether you are about to do “${top.name}”. It has cost ${money(-top.cost,false)} across ${top.n} ${top.n>1?'entries':'entry'}.`:top?'Your flagged habits have not cost money so far. Keep flagging them so the pattern stays visible.':'No habits flagged yet. Flag them as you go, by voice or on the entry, and this list fills in.';
  const weak=tb.length&&tb[0].pnl<0?tb[0]:null,best=cr.length&&cr[0].pnl>0?cr[0]:null;
  return `<div class="panel work glass"><div class="work-h"><h3>${icon('spark')}What to work on</h3></div><div class="hint">${esc(scopeLabel)}</div>
  ${tab.length?`<div class="wk-list">${tab.map((h,i)=>`<div class="wk"><span class="wk-n" aria-hidden="true">${i+1}</span><span><b>${esc(h.name)}</b><small>${h.n} flag${h.n>1?'s':''}, last ${esc(since(h.last))}</small></span><span class="wk-c ${cls(h.cost)}">${money(h.cost)}</span></div>`).join('')}</div>`:''}
  <p class="focus"><b>Focus:</b> ${esc(focus)}</p>
  ${weak||best?`<div class="hint" style="display:grid;gap:2px">${weak?`<span>Weakest window: <b>${esc(weak.label)}</b> (${money(weak.pnl)})</span>`:''}${best?`<span>Best confluence: <b>${esc(best.label)}</b> (${pct(best.winRate)} win rate)</span>`:''}</div>`:''}
  <div class="row" style="margin-top:14px"><button class="btn primary" data-act="work-ai" data-k="${key}" data-s="${scope}">Ask AI for a plan</button><span class="hint" id="wkstat-${key}"></span></div>
  <div class="ai-out" id="wkai-${key}" ${workAI[key]?'':'hidden'}>${workAI[key]?md(workAI[key]):''}</div></div>`;
}
async function genWorkPlan(key,scope){
  if(!AI){aiMissing();return}
  const ts=scopeTrades(scope),cl=ts.filter(closed);
  if(!cl.length){toast('Log a few closed entries first.');return}
  if(!aiBegin())return;
  const st=$('#wkstat-'+key),out=$('#wkai-'+key);if(st)st.textContent='Thinking...';
  const hab=habitTable(ts).filter(h=>h.n).map(h=>`${h.name}: ${h.n} flags, P&L when flagged ${Math.round(h.cost)}`).join('\n')||'none';
  const cf=confRows(ts).map(c=>`${c.label}: ${c.n} trades, P&L ${Math.round(c.pnl)}, win rate ${pct(c.winRate)}`).join('\n')||'none';
  const tbs=groupRows(ts,t=>bucketOf(t.time)).map(r=>`${r.label}: ${r.n} trades, P&L ${Math.round(r.pnl)}`).join('\n');
  const prompt=`You are a trading coach. From this journal data write a plan of exactly 3 hyphen bullets: what to work on next, most important first. Each bullet is one or two short sentences, specific, and cites numbers from the data. No financial advice, no market predictions.
Scope: ${scopeName(scope)}. ${statLine(stats(ts))}
Habits:
${hab}
Confluences:
${cf}
Time windows:
${tbs}`;
  try{
    if(out)out.hidden=false;
    const r=await AI(prompt,{onText:({text})=>{workAI[key]=text;if(out)out.innerHTML=md(text)}});
    workAI[key]=r.text;if(out)out.innerHTML=md(r.text);if(st)st.textContent='';
  }catch(e){if(st)st.textContent=aiErr(e);if(e&&e.text&&out){workAI[key]=e.text;out.innerHTML=md(e.text)}}
  aiEnd();
}

async function rewriteBtEntry(){

  if(!AI){aiMissing();return}
  const text=[t.details,t.transcript].filter(Boolean).join('\n\nWhat was said: ').trim();
  if(!text){toast('Add some notes first, then I can rewrite them.');return}
  if(!aiBegin())return;
  const btn=$('#aibtn'),st=$('#aistat');if(btn)btn.disabled=true;if(st)st.textContent='Rewriting...';
  const prompt=`You are Luma, a trading journal assistant. Rewrite this backtest journal entry into one clear write-up: a 2 sentence summary, a blank line, then 4 to 8 lines that each start with "- " (the read on the market, entry reason, execution, management, result, anything unusual, what went well, what to improve). If confluences are listed, end with a last line "Confluences: a, b, c." Use only the information given and never invent numbers. Reply with only the write-up text.
Trade: ${t.symbol} ${t.direction} on ${t.date} at ${t.time}, risk ${t.risk||'unknown'}, result ${t.open?'open':t.pnl}, setup ${t.setup||'not set'}.

function bars(rows){

}
function seriesOf(ts){

}
function lineChart(a,b){
  if(a.length<2&&(!b||b.length<2))return '<p class="hint">Log at least two closed trades to see the curve.</p>';
  const W=820,H=300,p={l:14,r:64,t:14,b:26},all=[...a,...(b||[])],xs=all.map(q=>q.x),ys=all.map(q=>q.y);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(0,...ys),y1=Math.max(0,...ys);
  const X=v=>p.l+(v-x0)/((x1-x0)||1)*(W-p.l-p.r),Y=v=>p.t+(1-(v-y0)/((y1-y0)||1))*(H-p.t-p.b);
  const path=s=>s.map((q,i)=>(i?'L':'M')+X(q.x).toFixed(1)+' '+Y(q.y).toFixed(1)).join(' ');
  let grid='';
  for(let i=0;i<=4;i++){const v=y0+(y1-y0)*i/4,yy=Y(v).toFixed(1);grid+=`<line x1="${p.l}" x2="${W-p.r}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-dasharray="3 5"/><text x="${W-p.r+8}" y="${(+yy+4).toFixed(1)}">${money(v,false).replace('-$','-$')}</text>`}
  let xl='';for(let i=0;i<5;i++){const v=x0+(x1-x0)*i/4;xl+=`<text x="${X(v).toFixed(1)}" y="${H-6}" text-anchor="${i===0?'start':i===4?'end':'middle'}">${new Date(v).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</text>`}
  const z=Y(0).toFixed(1);
  const cmp=b&&b.length>1?`<path d="${path(b)} L${X(b[b.length-1].x).toFixed(1)} ${z} L${X(b[0].x).toFixed(1)} ${z}Z" fill="var(--ink2)" opacity=".10"/><path d="${path(b)}" fill="none" stroke="var(--ink2)" stroke-width="1.6" opacity=".8" stroke-linejoin="round"/>`:'';
  const main=a.length>1?`<path d="${path(a)} L${X(a[a.length-1].x).toFixed(1)} ${z} L${X(a[0].x).toFixed(1)} ${z}Z" fill="url(#gA)"/><path d="${path(a)}" fill="none" stroke="var(--amber)" stroke-width="2.2" stroke-linejoin="round"/>`:'';
  return `<svg class="eq" viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumulative P&L over time"><defs><linearGradient id="gA" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#f5b731" stop-opacity=".38"/><stop offset="1" stop-color="#f5b731" stop-opacity="0"/></linearGradient></defs>${grid}<line x1="${p.l}" x2="${W-p.r}" y1="${z}" y2="${z}" stroke="var(--line2)"/>${cmp}${main}${xl}</svg>`;
}
function donut(rows,total){

function heatmap(ts){

function dashCalendar(all){
  const d=S.ui.dash,first=parseISO(S.ui.dashCal||monthStart(new Date())),y=first.getFullYear(),m=first.getMonth(),dim=new Date(y,m+1,0).getDate();
  const by={};all.forEach(t=>{(by[t.date]=by[t.date]||[]).push(t)});
  let mTot=0,mCount=0,winDays=0,lossDays=0,maxAbs=1;
  for(let i=1;i<=dim;i++){const cl=(by[iso(new Date(y,m,i))]||[]).filter(closed);if(cl.length){const t=sum(cl.map(x=>x.pnl));mTot+=t;mCount+=cl.length;if(t>0)winDays++;else if(t<0)lossDays++;maxAbs=Math.max(maxAbs,Math.abs(t))}}
  const start=new Date(y,m,1-first.getDay());let rows='';
  for(let w=0;w<6;w++){
    const rs=new Date(start);rs.setDate(start.getDate()+w*7);

    let cells='',wsum=0,wn=0;
    for(let i=0;i<7;i++){
      const dt=new Date(rs);dt.setDate(rs.getDate()+i);
      const ds=iso(dt),g=by[ds]||[],out=dt.getMonth()!==m,cl=g.filter(closed),tot=sum(cl.map(t=>t.pnl)),op=g.length-cl.length;
      if(!out){wsum+=tot;wn+=cl.length}
      if(!g.length){cells+=`<div class="dc none ${out?'out':''}"><span class="dc-n">${dt.getDate()}</span></div>`;continue}
      const tint=cl.length?`background:color-mix(in srgb,var(${tot>0?'--win':tot<0?'--loss':'--line2'}) ${Math.round(8+Math.min(1,Math.abs(tot)/maxAbs)*24)}%,var(--panel))`:'';
      cells+=`<button class="dc ${out?'out':''} ${S.ui.dashDay===ds?'sel':''}" style="${tint}" data-act="dcal-day" data-d="${ds}" aria-label="${esc(fmtDay(ds))}: ${g.length} trade${g.length>1?'s':''}, ${cl.length?money(tot):'open'}"><span class="dc-n">${dt.getDate()}</span><span class="dc-v ${cls(tot)}">${cl.length?money(tot):'Open'}</span><span class="dc-c">${g.length} trade${g.length>1?'s':''}${op&&cl.length?', '+op+' open':''}</span></button>`;
    }

function weekCounts(hid,ts){

}

const blobToB64=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(b)});
function parseJsonLoose(t){

function makeKeyAI(key){
  const MODELS={quick:'claude-haiku-4-5-20251001',default:'claude-sonnet-4-6',complex:'claude-sonnet-4-6'};
  const call=async(input,opts,asJson)=>{
    opts=opts||{};

    const merged=[];msgs.forEach(m=>{const l=merged[merged.length-1];if(l&&l.role===m.role)l.content+='\n\n'+m.content;else merged.push({...m})});
    msgs=merged;
    const imgs=opts.images?[].concat(Array.from(opts.images.length!=null&&!(opts.images instanceof Blob)?opts.images:[opts.images])):[];
    if(imgs.length){
      const parts=[];for(const b of imgs.slice(0,3))parts.push({type:'image',source:{type:'base64',media_type:b.type||'image/jpeg',data:await blobToB64(b)}});
      const last=msgs[msgs.length-1];last.content=[...parts,{type:'text',text:last.content}];
    }
    let r;
    try{
      const hdr={'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'};
      const wid=S&&S.settings&&String(S.settings.workspaceId||'').trim();
      if(wid)hdr['anthropic-workspace-id']=wid;
      r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal:opts.signal,headers:hdr,body:JSON.stringify({model:MODELS[opts.modelTier]||MODELS.default,max_tokens:2000,messages:msgs})});
    }catch(e){throw{code:e&&e.name==='AbortError'?'cancelled':'upstream_error',message:String(e&&e.message||e)}}
    if(!r.ok){
      let d={};try{d=await r.json()}catch(x){}
      const msg=String((d&&d.error&&d.error.message)||'').slice(0,160);
      const code=/workspace/i.test(msg)&&/anthropic-workspace-id|not scoped/i.test(msg)?'needs_workspace':r.status===429?'rate_limited':(r.status===401||r.status===403)?'not_granted':r.status===413?'prompt_too_large':/credit balance/i.test(msg)?'no_credit':r.status===404?'model_unavailable':'upstream_error';
      throw{code,message:msg||('The API returned '+r.status+'.')};
    }
    const j=await r.json(),text=(j.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('');

    if(asJson)return parseJsonLoose(text);

  };
  const f=(i,o)=>call(i,o,false);f.json=(i,o)=>call(i,o,true);f.limits=async()=>({images:{maxCount:3}});

}

const patternKey=s=>String(s||'').toLowerCase().replace(/[^a-z0-9%\s]/g,' ').replace(/\b(the|a|an|my|i|was|were|is|are|of)\b/g,' ').replace(/\s+/g,' ').trim();
function tallyItems(list,getItems){
  const m=new Map();
  list.forEach(t=>{const seen=new Set();getItems(t).forEach(x=>{const lab=String(x||'').trim(),k=patternKey(lab);if(!k||seen.has(k))return;seen.add(k);const e=m.get(k)||{k,n:0,labels:{}};e.n++;e.labels[lab]=(e.labels[lab]||0)+1;m.set(k,e)})});

  return m;
}

}

}

/* walkthrough -> entry */
function splitItems(x){return String(x||'').split(/,|;|\band\b/i).map(p=>p.replace(/\bat \d{1,2}(?::\d{2})?\s*(?:am|pm)?\b/ig,'').replace(/^[\s.]+|[\s.]+$/g,'').replace(/^(the|a|an)\s+/i,'').replace(/\s+(the|a|an|my)$/i,'').trim()).filter(p=>p.length>1)}
function localStructure(text){
  text=String(text).replace(/([a-z0-9%])\s+(I)\s+/g,'$1. $2 ');
  const t=text.toLowerCase(),sents=(text.match(/[^.!?]+[.!?]*/g)||[text]).map(s=>s.trim()).filter(Boolean);
  const dir=/\b(short|sold|selling|sell)\b/.test(t)?'short':/\b(long|bought|buying|buy)\b/.test(t)?'long':null;
  const rk=t.match(/risk(?:ed|ing)?(?: of)?\s*\$?\s*(\d+(?:\.\d+)?)/),sy=t.match(/\b(es|mes|nq|mnq|eurusd|gbpusd|xauusd|gold|spy|qqq|nasdaq)\b/);
  let pnl=null;
  const pm=t.match(/\b(?:result|p&l|pnl|profit)\s*(?:is|was|of)?\s*(plus|minus|positive|negative|\+|-)?\s*\$?\s*(\d+(?:\.\d+)?)/);
  if(pm)pnl=parseFloat(pm[2])*(/minus|negative|-/.test(pm[1]||'')?-1:1);
  else{const m2=t.match(/\b(won|made|gained|profit(?:ed)?|lost|loss)\s*\$?\s*(\d+(?:\.\d+)?)/);if(m2)pnl=parseFloat(m2[2])*(/lost|loss/.test(m2[1])?-1:1)}
  let time=null;const tm=t.match(/\bat (\d{1,2})(?::(\d{2}))?\s*(am|pm)?\b/);
  if(tm){let h=+tm[1];const mi=tm[2]?+tm[2]:0;if(tm[3]==='pm'&&h<12)h+=12;if(tm[3]==='am'&&h===12)h=0;if(h<24&&mi<60)time=pad(h)+':'+pad(mi)}
  /* confluences: “the confluences were a, b and c” */
  let conf=[];
  const cm=/\bconfluences?\b/i.exec(text);
  if(cm){
    let seg=text.slice(cm.index+cm[0].length).replace(/^\s*(?:are|is|were|was|being|include|included|:|-)\s*/i,'').replace(/^[\s.,:;!-]+/,'');
    const sp=seg.search(/[.!?](\s|$)/);if(sp>=0)seg=seg.slice(0,sp);
    const stop=seg.search(/\b(?:(?:the|my) )?(what i did|what went|went wrong|things? that went wrong|bad things?|bad points?|downsides?|the result|result is|result was|i risked|risk(?:ed)?\b|i entered|i took|then i|and then|i moved|however|overall|mistakes?|but i|i did)\b/i);if(stop>0)seg=seg.slice(0,stop);
    conf=splitItems(seg);
  }
  /* what went wrong: “the bad things were a and b”, “what went wrong was a”, “my mistakes were a, b” */
  let bad=[];
  const BADRE=/\b(?:the |my )?(?:bad things?(?: about (?:the|this) trade)?|bad points?|things? that went wrong|what went wrong|mistakes?|downsides?|what i did (?:badly|bad|wrong|poorly))\b/i;
  const bm=BADRE.exec(text);
  if(bm){
    let seg=text.slice(bm.index+bm[0].length).replace(/^\s*(?:are|is|were|was|being|include|included|:|-)\s*/i,'').replace(/^[\s.,:;!-]+/,'');
    const sp=seg.search(/[.!?](\s|$)/);if(sp>=0)seg=seg.slice(0,sp);
    const stop=seg.search(/\b(?:(?:the|my) )?(confluences?|the result|result is|result was|i risked|what went well|what i did (?:well|good|right)|however|overall|that'?s all)\b/i);if(stop>0)seg=seg.slice(0,stop);
    bad=splitItems(seg);
  }
  const facts=[];if(rk)facts.push('Risked $'+rk[1]);if(pnl!=null)facts.push('result '+money(pnl));else facts.push('result still open');
  const rest=sents.filter(s=>!/\bconfluences?\b/i.test(s)&&!BADRE.test(s)&&!(/^(?:hey |yo )?(?:journal|log|record|write up)\b/i.test(s)&&s.split(/\s+/).length<7));
  const entry=[facts.length?'- '+facts.join(', ')+'.':''].concat(rest.map(s=>'- '+s.replace(/\s*[.!]+$/,'')+'.')).filter(Boolean).join('\n');
  const habs=sents.concat(bad).filter(s=>/(mistake|bad habit|shouldn'?t|chased|moved my stop|revenge|oversiz|too early|ignored)/i.test(s)).map(s=>matchHabit(s)).filter(Boolean).map(h=>h.name);
  return{symbol:sy?SYMS[sy[1]]:null,direction:dir,risk:rk?parseFloat(rk[1]):null,pnl,time,setup:null,entry,confluences:conf.slice(0,8),wentWrong:bad.slice(0,8),habits:[...new Set(habs)].slice(0,2)};
}
async function aiStructure(text,shotId){
  const opts={modelTier:'default'};
  if(shotId&&AICAPS&&AICAPS.images){try{const b=await media.get(shotId);if(b)opts.images=[b]}catch(e){}}
  const prompt=`You are Luma, a trading journal assistant. A trader talked through one trade. Turn the walkthrough into one journal entry. ${opts.images?'The attached image is the chart they were looking at. ':''}Use only what they said or what is visible; never invent numbers. If they say the result is blank, pending, open or not known, set pnl to null. Reply with only a JSON object:
{"symbol": string|null, "direction": "long"|"short"|null, "risk": number|null, "pnl": number|null (negative for a loss), "time": "HH:MM" 24-hour if they said when they entered, else null, "setup": string|null, "confluences": string[] (short phrases; when they say things like "the confluences were ...", list each one), "wentWrong": string[] (short phrases for the bad things about the trade: mistakes, weak spots, anything that hurt it; when they say things like "the bad things were ...", "what went wrong was ..." or "my mistakes were ...", list each one), "habits": string[] (bad habits they admitted to; prefer names from the allowed list, otherwise a short new name), "entry": string}

Allowed habit names: ${S.habits.map(h=>h.name).join(', ')}
Walkthrough: ${text.slice(0,7000)}`;
  const out=await AI.json(prompt,opts);

}
function withConfLine(entry,conf,bad){
  entry=String(entry||'').trim();conf=conf||[];bad=bad||[];
  if(conf.length&&!/^\s*Confluences:/mi.test(entry))entry=(entry?entry+'\n\n':'')+'Confluences: '+conf.join(', ')+'.';
  if(bad.length&&!/^\s*What went wrong:/mi.test(entry))entry=(entry?entry+(/Confluences: [^\n]*$/.test(entry)?'\n':'\n\n'):'')+'What went wrong: '+bad.join(', ')+'.';

}
async function entryFromText(text,shotId){
  let data=null,usedAI=false;

  const tm=/^\d{1,2}:\d{2}$/.test(String(data.time||''))?pad(parseInt(data.time))+':'+String(data.time).split(':')[1]:nowHM();
  const list=a=>(Array.isArray(a)?a:[]).map(x=>String(x).trim()).filter(Boolean).slice(0,8);
  const conf=list(data.confluences).map(c=>c.charAt(0).toUpperCase()+c.slice(1));

    pnl:hasPnl?pnl:0,open:!hasPnl,setup:data.setup?String(data.setup):'',details:withConfLine(data.entry||data.details||text,conf,bad),bad:[],
    habits:habs,transcript:text,imageIds:shotId?[shotId]:[],ai:null,date:iso(new Date()),time:tm,merged:true});
  addConfs(t,conf);addBad(t,bad);
  S.trades.push(t);sess.tradeIds.push(t.id);persist();renderTop();

}
